<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Card payment (foreign origin)</title>
<style> card-security-block { display: block; width: 380px; height: 90px; } </style>
</head>
<body>
  <h2>Card details</h2>

  <label for="card-number">Card Number</label>
  <input id="card-number" name="card_number" type="text" inputmode="numeric"
         autocomplete="cc-number" maxlength="19" required>

  <label for="card-expiry">Expiry (MM/YY)</label>
  <input id="card-expiry" name="card_expiry" type="text" autocomplete="cc-exp"
         pattern="[0-9]{2}/[0-9]{2}" required>

  <label for="billing-postcode">Billing Postcode</label>
  <input id="billing-postcode" name="billing_postcode" type="text"
         autocomplete="postal-code">

  <!-- A CLOSED shadow component INSIDE the foreign frame. The capture init
       script is installed on the CONTEXT, so it runs in every frame the context
       loads — including this one, which no same-origin trick could reach. -->
  <card-security-block id="cvc-block"></card-security-block>

  <button type="button" id="pay-now">Pay Now</button>

  <script>
    class CardSecurityBlock extends HTMLElement {
      connectedCallback() {
        const root = this.attachShadow({ mode: "closed" });
        root.innerHTML = [
          '<label for="card-cvc">Security Code</label>',
          '<input id="card-cvc" name="card_cvc" type="text" inputmode="numeric"',
          ' autocomplete="cc-csc" maxlength="4" required>'
        ].join("");
      }
    }
    customElements.define("card-security-block", CardSecurityBlock);
  </script>
</body>
</html>
