<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Fixture 21 — underwriting (window.open)</title></head>
<body>
  <main>
    <h1>Underwriting review</h1>
    <p>Opened by window.open() rather than by a target=_blank anchor.</p>
    <label for="uw-decision">Underwriting Decision</label>
    <select id="uw-decision" name="uw_decision">
      <option value="">Choose</option>
      <option value="accept">Accept</option>
      <option value="rate">Rate</option>
      <option value="decline">Decline</option>
    </select>
    <button type="button" id="record-decision">Record Decision</button>
  </main>
</body>
</html>
