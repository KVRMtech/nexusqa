# ─────────────────────────────────────────────────────────────
# QE-Central egress proxy (qec-egress-proxy) — PER-CRAWL host allowlist.
# Design §1.1: the contained explorer sits on internal-only networks and its
# ONLY route to the internet is this proxy. squid enforces the HOST allowlist;
# the explorer's in-browser guard (app/guard.py) enforces the METHOD. HTTPS is
# CONNECT-tunnelled, so squid sees only the destination host (never the URL
# path) for TLS — the guard is what refuses mutating methods over TLS.
#
# ── The PER-CRAWL fence mechanism (Team A / Phase A; the frozen shape is
#    Nexus_power/contracts/fleet_egress_fence_v1.json) ─────────────────────
# The old design matched ONE `dstdomain allowed_domains.txt` ACL against every
# request, so two crawls concurrently dispatched to this worker shared one
# fence and the last writer re-fenced the other tenant's live browser (the
# T-FL-08 strict-xfail defect; ARB_EGRESS_FENCE_DECISION.md explains why
# per-crawl FILES alone could not fix it: squid had no per-request identity to
# select a fence BY).
#
# The identity is the PROXY LOGIN. Each browser context authenticates with
# username = its crawl id (basic_fake_auth accepts any password — the username
# is the whole identity; adequate because the threat is concurrent crawls
# accidentally sharing a fence, not the trusted explorer process forging
# logins). qe-central writes, per dispatch:
#
#   /etc/squid/allowlist/crawls/allowlist.<crawl_id>.txt   (dstdomain file)
#   /etc/squid/allowlist/crawls.conf                       (generated include:
#        acl crawl_<id> proxy_auth <id>
#        acl fence_<id> dstdomain ".../crawls/allowlist.<id>.txt"
#        http_access allow crawl_<id> fence_<id>)
#   /etc/squid/allowlist/reload.stamp                      (content changes ->
#        the compose watcher HUPs squid, which re-reads this whole config)
#
# FAIL-CLOSED BY CONSTRUCTION: no credentials -> 407 and nothing is reachable;
# credentials but a foreign destination -> the final deny; a crawl whose fence
# was never written has no ACL pair at all; an EMPTY crawls.conf (seeded by
# the compose entrypoint) denies all real egress. The legacy per-worker
# allowed_domains.txt is DELIBERATELY not consulted any more — an old
# qe-central writing only that file gets denials, never a shared fence.
# ─────────────────────────────────────────────────────────────

# The crawl's identity: proxy basic auth, username = crawl id. basic_fake_auth
# ships with squid and accepts any password — see the fence-mechanism note.
auth_param basic program /usr/lib/squid/basic_fake_auth
auth_param basic children 5 startup=1 idle=1
auth_param basic realm qec-egress-fence
auth_param basic credentialsttl 1 minute
auth_param basic casesensitive on
acl fenced_crawl proxy_auth REQUIRED

acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

# Refuse unsafe ports and CONNECT to anything but 443 outright.
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

# Every request must carry a crawl identity (407 challenge otherwise). This
# line is what makes the per-crawl allow lines below selectable at all.
http_access deny !fenced_crawl

# The ONLY allow rules: the generated per-crawl fences. One ACL pair + one
# allow per LIVE crawl; regenerated by qe-central on every dispatch/completion.
include /etc/squid/allowlist/crawls.conf

# Fail-closed default — deny everything else (non-allowlisted hosts, foreign
# crawls' hosts, the nexus stack, metadata endpoints, the wider internet).
http_access deny all

http_port 3128

# No caching — evidence integrity: never serve a stale or poisoned response,
# and keep zero client data at rest in the proxy.
cache deny all
maximum_object_size 0 KB

# Do not leak the proxy's presence, version, or the internal client topology.
via off
forwarded_for delete
httpd_suppress_version_string on
request_header_access X-Forwarded-For deny all

# Logs to the container's stdio for the mutation-proof / egress-proof audit
# (design §7 item 5: "container cannot reach anything but allowlist"). squid
# refuses to run as root and its non-root `proxy` user otherwise cannot reopen
# the root-owned container /dev/stdout (→ FATAL "Cannot open /dev/stdout"). The
# compose entrypoint chowns /dev/stdout + /dev/stderr to `proxy` before `exec
# squid`, so the proxy user can write both. Log destination never affects
# enforcement — the ACLs above are what contain egress. The %un field in the
# default squid format records the authenticated crawl id per request, which is
# exactly the per-crawl egress evidence the bundle joins on.
logfile_rotate 0
access_log stdio:/dev/stdout squid
cache_log /dev/stderr

# Keep DNS failures on blocked hosts quick to expire (do not cache an NXDOMAIN
# for a host that is about to be allowlisted). NOTE: `dns_v4_first` was removed —
# it is obsolete in modern squid (logs an error and is ignored). This VM has no
# IPv6 egress, but squid resolves + connects over IPv4 fine, so no v4/v6
# preference directive is needed.
negative_dns_ttl 1 seconds
shutdown_lifetime 5 seconds
