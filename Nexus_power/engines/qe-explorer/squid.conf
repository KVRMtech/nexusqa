# ─────────────────────────────────────────────────────────────
# QE-Central egress proxy (qec-egress-proxy) — HARD host allowlist.
# Design §1.1: the contained explorer sits on internal-only networks and its
# ONLY route to the internet is this proxy. squid enforces the HOST allowlist;
# the explorer's in-browser guard (app/guard.py) enforces the METHOD. HTTPS is
# CONNECT-tunnelled, so squid sees only the destination host (never the URL
# path) for TLS — the guard is what refuses mutating methods over TLS.
#
# ── The allowlist mechanism (documented) ─────────────────────────────────────
# `dstdomain "/etc/squid/allowlist/allowed_domains.txt"` reads one destination
# domain per line (e.g. `.acmelife.example` matches the domain + subdomains).
# The file lives on the shared `qec-egress-allowlist` volume; qe-central writes
# the target app's registrable domain(s) into it BEFORE each dispatch and then
# reloads squid (`squid -k reconfigure`) so the ACL is re-read. An EMPTY or
# sentinel-only file therefore DENIES ALL real egress — fail-closed by
# construction (a mis-provisioned crawl reaches nothing rather than the world).
#
# squid parses ACL files at (re)configure time; the compose command seeds a
# fail-closed sentinel so squid always starts even before the first crawl.
# ─────────────────────────────────────────────────────────────

acl allowed_domains dstdomain "/etc/squid/allowlist/allowed_domains.txt"

acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

# Refuse unsafe ports and CONNECT to anything but 443 outright.
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

# The ONLY allow rule: allowlisted destination domains (plain HTTP + HTTPS
# CONNECT). Everything not on the allowlist falls through to the final deny.
http_access allow allowed_domains

# Fail-closed default — deny everything else (non-allowlisted hosts, the nexus
# stack, metadata endpoints, the wider internet).
http_access deny all

http_port 3128

# No caching — evidence integrity: never serve a stale or poisoned response,
# and keep zero client data at rest in the proxy.
cache deny all
maximum_object_size 0 KB

# Do not leak the proxy's presence, version, or the internal client topology.
via off
forwarded_for delete
httpd_suppress_version_string on
request_header_access X-Forwarded-For deny all

# Logs to the container's stdio for the mutation-proof / egress-proof audit
# (design §7 item 5: "container cannot reach anything but allowlist"). squid
# refuses to run as root and its non-root `proxy` user otherwise cannot reopen
# the root-owned container /dev/stdout (→ FATAL "Cannot open /dev/stdout"). The
# compose entrypoint chowns /dev/stdout + /dev/stderr to `proxy` before `exec
# squid`, so the proxy user can write both. Log destination never affects
# enforcement — the allowlist ACL above is what contains egress.
logfile_rotate 0
access_log stdio:/dev/stdout squid
cache_log /dev/stderr

# Keep DNS deterministic and quick to fail on blocked hosts.
dns_v4_first on
negative_dns_ttl 1 seconds
shutdown_lifetime 5 seconds
