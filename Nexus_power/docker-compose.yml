x-common-env:
  NEXUS_ENV: ${NEXUS_ENV:-development}
  NEXUS_PRODUCT_MODE: ${NEXUS_PRODUCT_MODE:-canonical}
  NEXUS_STORAGE_PATH: ${NEXUS_STORAGE_PATH:-/app/service/data}
  NEXUS_ORCHESTRATOR_URL: ${NEXUS_ORCHESTRATOR_URL:-http://orchestrator:8100}
  NEXUS_JWT_SECRET: ${NEXUS_JWT_SECRET:?NEXUS_JWT_SECRET must be set to a strong random value (e.g. openssl rand -hex 32) - refusing to start with a published development default}
  JWT_SECRET: ${NEXUS_JWT_SECRET:?NEXUS_JWT_SECRET must be set to a strong random value (e.g. openssl rand -hex 32) - refusing to start with a published development default}
  REDIS_HOST: redis
  REDIS_PORT: '6379'
  REDIS_URL: redis://redis:6379/0
  POSTGRES_HOST: postgres
  POSTGRES_PORT: '5432'
  POSTGRES_USER: ${POSTGRES_USER:-nexus}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexus-dev}
  POSTGRES_DB: ${POSTGRES_DB:-nexus}
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:-nexus-neo4j-dev}
  MILVUS_HOST: ${MILVUS_HOST:-milvus}
  MILVUS_PORT: ${MILVUS_PORT:-19530}
  LLM_BACKEND: ollama
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
  EYES_OLLAMA_BASE_URL: ${EYES_OLLAMA_BASE_URL:-http://ollama:11434}
  EYES_OLLAMA_MODEL: ${EYES_OLLAMA_MODEL:-moondream}
  EYES_OLLAMA_INFERENCE_TIMEOUT: ${EYES_OLLAMA_INFERENCE_TIMEOUT:-600}
  EYES_VISION_TIER1_PROVIDER: ${EYES_VISION_TIER1_PROVIDER:-}
  EYES_VISION_TIER1_MODEL: ${EYES_VISION_TIER1_MODEL:-claude-sonnet-4-6}
  EYES_VISION_TIER1_API_KEY: ${EYES_VISION_TIER1_API_KEY:-}
  EYES_VISION_TIER1_TIMEOUT: ${EYES_VISION_TIER1_TIMEOUT:-60}
  EYES_VISION_TIER2_PROVIDER: ${EYES_VISION_TIER2_PROVIDER:-}
  EYES_VISION_TIER2_MODEL: ${EYES_VISION_TIER2_MODEL:-gpt-4o}
  EYES_VISION_TIER2_API_KEY: ${EYES_VISION_TIER2_API_KEY:-}
  EYES_VISION_TIER2_TIMEOUT: ${EYES_VISION_TIER2_TIMEOUT:-60}
  EYES_VISION_TIER3_PROVIDER: ${EYES_VISION_TIER3_PROVIDER:-}
  EYES_VISION_TIER3_MODEL: ${EYES_VISION_TIER3_MODEL:-llava:7b}
  EYES_VISION_TIER3_BASE_URL: ${EYES_VISION_TIER3_BASE_URL:-http://ollama:11434}
  LLM_MAX_TOKENS: '2048'
  GATEWAY_MAX_REQUEST_BODY_MB: '500'
  MAX_REQUEST_BODY_MB: '500'
  HEART_OLLAMA_BASE_URL: ${HEART_OLLAMA_BASE_URL:-http://ollama:11434}
  HEART_OLLAMA_MODEL: ${HEART_OLLAMA_MODEL:-llama3.2:1b}
  HEART_TIER3_PROVIDER: ${HEART_TIER3_PROVIDER:-ollama}
  HEART_TIER3_OLLAMA_BASE_URL: ${HEART_TIER3_OLLAMA_BASE_URL:-http://ollama:11434}
  HEART_TIER3_MODEL: ${HEART_TIER3_MODEL:-llama3.2:1b}
  HEART_TIER3_TIMEOUT: '600'
  HEART_TIER3_MAX_RETRIES: '1'
  BRAIN_OLLAMA_BASE_URL: ${BRAIN_OLLAMA_BASE_URL:-http://ollama:11434}
  BRAIN_OLLAMA_MODEL: ${BRAIN_OLLAMA_MODEL:-llama3.2:1b}
  BRAIN_TIER3_PROVIDER: ${BRAIN_TIER3_PROVIDER:-ollama}
  BRAIN_TIER3_OLLAMA_BASE_URL: ${BRAIN_TIER3_OLLAMA_BASE_URL:-http://ollama:11434}
  BRAIN_TIER3_MODEL: ${BRAIN_TIER3_MODEL:-llama3.2:1b}
  BRAIN_TIER3_TIMEOUT: '780'
  BRAIN_TIER3_MAX_RETRIES: '1'
x-healthcheck:
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 30s
volumes:
  redis-data: null
  kek-store: null
  api-data: null
  postgres-data: null
  neo4j-data: null
  ollama-data: null
  model-cache: null
  document-storage: null
  evidence-storage: null
  report-storage: null
  upload-storage: null
  frame-storage: null
  audio-storage: null
  etcd-data: null
  minio-data: null
  milvus-data: null
networks:
  nexus:
    driver: bridge
services:
  redis:
    image: redis:7-alpine
    container_name: nexus-redis
    restart: unless-stopped
    ports:
    - ${REDIS_PORT:-6379}:6379
    volumes:
    - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
    - nexus
  postgres:
    image: postgres:16-alpine
    container_name: nexus-postgres
    restart: unless-stopped
    ports:
    - ${POSTGRES_HOST_PORT:-5433}:5432
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexus}
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexus-dev}
    volumes:
    - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER:-nexus}
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
    - nexus
  neo4j:
    image: neo4j:5-community
    container_name: nexus-neo4j
    restart: unless-stopped
    ports:
    - 7474:7474
    - 7687:7687
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-nexus-neo4j-dev}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_max__size: 512M
      NEO4J_server_memory_pagecache_size: 256M
    volumes:
    - neo4j-data:/data
    healthcheck:
      test:
      - CMD-SHELL
      - wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
    - nexus
  ollama:
    image: ollama/ollama:latest
    container_name: nexus-ollama
    restart: unless-stopped
    ports:
    - ${OLLAMA_PORT:-11434}:11434
    volumes:
    - ollama-data:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: '-1'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      OLLAMA_LLM_LIBRARY: cuda_v13
    healthcheck:
      test:
      - CMD
      - ollama
      - list
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
    - nexus
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: all
            capabilities:
            - gpu
  etcd:
    profiles:
    - full
    image: quay.io/coreos/etcd:v3.5.5
    container_name: nexus-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: '1000'
      ETCD_QUOTA_BACKEND_BYTES: '4294967296'
      ETCD_SNAPSHOT_COUNT: '50000'
    command:
    - etcd
    - -advertise-client-urls=http://etcd:2379
    - -listen-client-urls=http://0.0.0.0:2379
    - --data-dir=/etcd
    volumes:
    - etcd-data:/etcd
    healthcheck:
      test:
      - CMD
      - etcdctl
      - endpoint
      - health
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
    - nexus
  minio:
    profiles:
    - full
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: nexus-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: minio server /minio_data --console-address ":9001"
    volumes:
    - minio-data:/minio_data
    ports:
    - ${MINIO_API_PORT:-9000}:9000
    - ${MINIO_CONSOLE_PORT:-9001}:9001
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:9000/minio/health/live
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
    - nexus
  milvus:
    profiles:
    - full
    image: milvusdb/milvus:v2.4.5
    container_name: nexus-milvus
    restart: unless-stopped
    command:
    - milvus
    - run
    - standalone
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      COMMON_STORAGETYPE: minio
    volumes:
    - milvus-data:/var/lib/milvus
    ports:
    - ${MILVUS_PORT:-19530}:19530
    - ${MILVUS_METRICS_PORT:-9091}:9091
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:9091/healthz
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
    - nexus
  auth-service:
    build:
      context: ./platform/auth-service
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: nexus-base:dev
    container_name: nexus-auth
    restart: unless-stopped
    ports:
    - 8000:8000
    environment:
      NEXUS_ENV: ${NEXUS_ENV:-development}
      NEXUS_PRODUCT_MODE: ${NEXUS_PRODUCT_MODE:-canonical}
      NEXUS_STORAGE_PATH: ${NEXUS_STORAGE_PATH:-/app/service/data}
      NEXUS_ORCHESTRATOR_URL: ${NEXUS_ORCHESTRATOR_URL:-http://orchestrator:8100}
      NEXUS_JWT_SECRET: ${NEXUS_JWT_SECRET:?NEXUS_JWT_SECRET must be set to a strong random value (e.g. openssl rand -hex 32) - refusing to start with a published development default}
      JWT_SECRET: ${NEXUS_JWT_SECRET:?NEXUS_JWT_SECRET must be set to a strong random value (e.g. openssl rand -hex 32) - refusing to start with a published development default}
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_URL: redis://redis:6379/0
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexus-dev}
      POSTGRES_DB: ${POSTGRES_DB:-nexus}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-nexus-neo4j-dev}
      MILVUS_HOST: ${MILVUS_HOST:-milvus}
      MILVUS_PORT: ${MILVUS_PORT:-19530}
      LLM_BACKEND: ollama
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      EYES_OLLAMA_BASE_URL: ${EYES_OLLAMA_BASE_URL:-http://ollama:11434}
      EYES_OLLAMA_MODEL: ${EYES_OLLAMA_MODEL:-moondream}
      EYES_OLLAMA_INFERENCE_TIMEOUT: ${EYES_OLLAMA_INFERENCE_TIMEOUT:-600}
      EYES_VISION_TIER1_PROVIDER: ${EYES_VISION_TIER1_PROVIDER:-}
      EYES_VISION_TIER1_MODEL: ${EYES_VISION_TIER1_MODEL:-claude-sonnet-4-6}
      EYES_VISION_TIER1_API_KEY: ${EYES_VISION_TIER1_API_KEY:-}
      EYES_VISION_TIER1_TIMEOUT: ${EYES_VISION_TIER1_TIMEOUT:-60}
      EYES_VISION_TIER2_PROVIDER: ${EYES_VISION_TIER2_PROVIDER:-}
      EYES_VISION_TIER2_MODEL: ${EYES_VISION_TIER2_MODEL:-gpt-4o}
      EYES_VISION_TIER2_API_KEY: ${EYES_VISION_TIER2_API_KEY:-}
      EYES_VISION_TIER2_TIMEOUT: ${EYES_VISION_TIER2_TIMEOUT:-60}
      EYES_VISION_TIER3_PROVIDER: ${EYES_VISION_TIER3_PROVIDER:-}
      EYES_VISION_TIER3_MODEL: ${EYES_VISION_TIER3_MODEL:-llava:7b}
      EYES_VISION_TIER3_BASE_URL: ${EYES_VISION_TIER3_BASE_URL:-http://ollama:11434}
      LLM_MAX_TOKENS: '2048'
      GATEWAY_MAX_REQUEST_BODY_MB: '500'
      MAX_REQUEST_BODY_MB: '500'
      HEART_OLLAMA_BASE_URL: ${HEART_OLLAMA_BASE_URL:-http://ollama:11434}
      HEART_OLLAMA_MODEL: ${HEART_OLLAMA_MODEL:-llama3.2:1b}
      HEART_TIER3_PROVIDER: ${HEART_TIER3_PROVIDER:-ollama}
      HEART_TIER3_OLLAMA_BASE_URL: ${HEART_TIER3_OLLAMA_BASE_URL:-http://ollama:11434}
      HEART_TIER3_MODEL: ${HEART_TIER3_MODEL:-llama3.2:1b}
      HEART_TIER3_TIMEOUT: '600'
      HEART_TIER3_MAX_RETRIES: '1'
      BRAIN_OLLAMA_BASE_URL: ${BRAIN_OLLAMA_BASE_URL:-http://ollama:11434}
      BRAIN_OLLAMA_MODEL: ${BRAIN_OLLAMA_MODEL:-llama3.2:1b}
      BRAIN_TIER3_PROVIDER: ${BRAIN_TIER3_PROVIDER:-ollama}
      BRAIN_TIER3_OLLAMA_BASE_URL: ${BRAIN_TIER3_OLLAMA_BASE_URL:-http://ollama:11434}
      BRAIN_TIER3_MODEL: ${BRAIN_TIER3_MODEL:-llama3.2:1b}
      BRAIN_TIER3_TIMEOUT: '780'
      BRAIN_TIER3_MAX_RETRIES: '1'
      ENGINE_PORT: '8000'
    healthcheck:
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
      test:
      - CMD
      - curl
      - -sf
      - http://localhost:8000/health
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      base-image:
        condition: service_completed_successfully
    networks:
    - nexus
  gateway:
    build:
      context: ./platform/gateway
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: nexus-base:dev
    container_name: nexus-gateway
    restart: unless-stopped
    ports:
    - 8080:8080
    environment:
      NEXUS_ENV: ${NEXUS_ENV:-development}
      NEXUS_PRODUCT_MODE: ${NEXUS_PRODUCT_MODE:-canonical}
      NEXUS_STORAGE_PATH: ${NEXUS_STORAGE_PATH:-/app/service/data}
      NEXUS_ORCHESTRATOR_URL: ${NEXUS_ORCHESTRATOR_URL:-http://orchestrator:8100}
      NEXUS_JWT_SECRET: ${NEXUS_JWT_SECRET:?NEXUS_JWT_SECRET must be set to a strong random value (e.g. openssl rand -hex 32) - refusing to start with a published development default}
      JWT_SECRET: ${NEXUS_JWT_SECRET:?NEXUS_JWT_SECRET must be set to a strong random value (e.g. openssl rand -hex 32) - refusing to start with a published development default}
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_URL: redis://redis:6379/0
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexus-dev}
      POSTGRES_DB: ${POSTGRES_DB:-nexus}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-nexus-neo4j-dev}
      MILVUS_HOST: ${MILVUS_HOST:-milvus}
      MILVUS_PORT: ${MILVUS_PORT:-19530}
      LLM_BACKEND: ollama
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      EYES_OLLAMA_BASE_URL: ${EYES_OLLAMA_BASE_URL:-http://ollama:11434}
      EYES_OLLAMA_MODEL: ${EYES_OLLAMA_MODEL:-moondream}
      EYES_OLLAMA_INFERENCE_TIMEOUT: ${EYES_OLLAMA_INFERENCE_TIMEOUT:-600}
      EYES_VISION_TIER1_PROVIDER: ${EYES_VISION_TIER1_PROVIDER:-}
      EYES_VISION_TIER1_MODEL: ${EYES_VISION_TIER1_MODEL:-claude-sonnet-4-6}
      EYES_VISION_TIER1_API_KEY: ${EYES_VISION_TIER1_API_KEY:-}
      EYES_VISION_TIER1_TIMEOUT: ${EYES_VISION_TIER1_TIMEOUT:-60}
      EYES_VISION_TIER2_PROVIDER: ${EYES_VISION_TIER2_PROVIDER:-}
      EYES_VISION_TIER2_MODEL: ${EYES_VISION_TIER2_MODEL:-gpt-4o}
      EYES_VISION_TIER2_API_KEY: ${EYES_VISION_TIER2_API_KEY:-}
      EYES_VISION_TIER2_TIMEOUT: ${EYES_VISION_TIER2_TIMEOUT:-60}
      EYES_VISION_TIER3_PROVIDER: ${EYES_VISION_TIER3_PROVIDER:-}
      EYES_VISION_TIER3_MODEL: ${EYES_VISION_TIER3_MODEL:-llava:7b}
      EYES_VISION_TIER3_BASE_URL: ${EYES_VISION_TIER3_BASE_URL:-http://ollama:11434}
      LLM_MAX_TOKENS: '2048'
      GATEWAY_MAX_REQUEST_BODY_MB: '500'
      MAX_REQUEST_BODY_MB: '500'
      HEART_OLLAMA_BASE_URL: ${HEART_OLLAMA_BASE_URL:-http://ollama:11434}
      HEART_OLLAMA_MODEL: ${HEART_OLLAMA_MODEL:-llama3.2:1b}
      HEART_TIER3_PROVIDER: ${HEART_TIER3_PROVIDER:-ollama}
      HEART_TIER3_OLLAMA_BASE_URL: ${HEART_TIER3_OLLAMA_BASE_URL:-http://ollama:11434}
      HEART_TIER3_MODEL: ${HEART_TIER3_MODEL:-llama3.2:1b}
