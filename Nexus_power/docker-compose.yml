      auth-service:
        condition: service_healthy
      redis:
        condition: service_healthy
      base-image:
        condition: service_completed_successfully
    networks:
    - nexus
  platform-api:
    build:
      context: ./platform/api
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: nexus-base:dev
    container_name: nexus-platform-api
    restart: unless-stopped
    ports:
    - 8091:8091
    environment:
      RUNNER_TOKEN: ${RUNNER_TOKEN:-}
      NEXUS_MEMBER_DATA_RESOLVER: ${NEXUS_MEMBER_DATA_RESOLVER:-}
      NEXUS_ENV_ROUTING: ${NEXUS_ENV_ROUTING:-}
      NEXUS_CARD_HEALTH_GATE: ${NEXUS_CARD_HEALTH_GATE:-}
      # Session hand-off (E3): accept a crawler-relayed Playwright storageState and
      # store it as this artifact's ENCRYPTED auth profile, so a generated test can
      # run from a cold, authenticated session. OFF by default (endpoint 403s);
      # enabled here so an authenticated crawl's session flows crawl → run.
      NEXUS_QEC_AUTH_IMPORT_ENABLED: "true"
      # The session is encrypted at rest by the EnvelopeService — platform-api
      # needs the SAME KEK config qe-central uses (GCP-KMS via the VM's ADC), or
      # /auth/import fail-closes 503 rather than store a session in plaintext.
      # The EnvelopeService is constructed by the Knowledge-Foundation subsystem,
      # which is gated by its own flag — enable it so app.state.envelope_service
      # exists (feature flags remain individually off, resolved from DB/redis).
      NEXUS_KNOWLEDGE_FOUNDATION_ENABLED: "true"
      NEXUS_KEK_PROVIDER: ${NEXUS_KEK_PROVIDER:-local}
      NEXUS_KEK_GCP_KEY: ${NEXUS_KEK_GCP_KEY:-}
      NEXUS_AUDITOR_GATE: "block"
      NEXUS_AUDITOR_MIN_SCORE: "9"
      STORYBOARD_PAGE_VISIT_VISION_IDENTITY: "true"
      STORYBOARD_PAGE_VISIT_ADDRESS_BAR_CROP: "true"
      STORYBOARD_PAGE_VISIT_LLM_INFERENCE: "true"
      NEXUS_ENV: ${NEXUS_ENV:-development}
      NEXUS_PRODUCT_MODE: ${NEXUS_PRODUCT_MODE:-canonical}
      NEXUS_STORAGE_PATH: ${NEXUS_STORAGE_PATH:-/app/service/data}
      NEXUS_ORCHESTRATOR_URL: ${NEXUS_ORCHESTRATOR_URL:-http://orchestrator:8100}
      NEXUS_JWT_SECRET: ${NEXUS_JWT_SECRET:?NEXUS_JWT_SECRET must be set to a strong random value (e.g. openssl rand -hex 32) - refusing to start with a published development default}
      JWT_SECRET: ${NEXUS_JWT_SECRET:?NEXUS_JWT_SECRET must be set to a strong random value (e.g. openssl rand -hex 32) - refusing to start with a published development default}
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_URL: redis://redis:6379/0
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
