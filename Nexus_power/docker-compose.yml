    environment:
      <<: *common-env
      ENGINE_PORT: "8011"
      NEXUS_ALLOW_DEGRADED_MODE: "true"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8011/health"]
      <<: *engine-healthcheck
    depends_on:
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
      base-image:
        condition: service_completed_successfully
    networks:
      - nexus

