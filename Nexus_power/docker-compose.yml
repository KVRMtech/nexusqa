      BRAIN_OLLAMA_MODEL: ${BRAIN_OLLAMA_MODEL:-llama3.2:1b}
      BRAIN_TIER3_PROVIDER: ${BRAIN_TIER3_PROVIDER:-ollama}
      BRAIN_TIER3_OLLAMA_BASE_URL: ${BRAIN_TIER3_OLLAMA_BASE_URL:-http://ollama:11434}
      BRAIN_TIER3_MODEL: ${BRAIN_TIER3_MODEL:-llama3.2:1b}
      BRAIN_TIER3_TIMEOUT: '780'
      BRAIN_TIER3_MAX_RETRIES: '1'
      ENGINE_PORT: '8080'
      AUTH_SERVICE_URL: http://auth-service:8000
      SHIELD_ENGINE_URL: http://shield:8001
      EARS_ENGINE_URL: http://ears:8002
      EYES_ENGINE_URL: http://eyes:8003
      HEART_ENGINE_URL: http://heart:8004
      BACKBONE_ENGINE_URL: http://backbone:8005
      NERVES_ENGINE_URL: http://nerves:8006
      LEGS_ENGINE_URL: http://legs:8007
      HANDS_ENGINE_URL: http://hands:8008
      SPINE_ENGINE_URL: http://spine:8009
      MOUTH_ENGINE_URL: http://mouth:8010
      BRAIN_ENGINE_URL: http://brain:8011
      PLATFORM_API_URL: http://platform-api:8091
      ORCHESTRATOR_URL: http://orchestrator:8100
      QA_ORCHESTRATOR_URL: http://qa-orchestrator:8092
