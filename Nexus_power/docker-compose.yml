  ollama-warmup:
    image: curlimages/curl:latest
    container_name: nexus-ollama-warmup
    depends_on:
      ollama:
        condition: service_healthy
    networks:
    - nexus
    restart: 'no'
    command:
    - sh
    - -c
    - 'echo "Waiting for ollama..."; until curl -sf http://ollama:11434/api/tags >/dev/null;
      do sleep 2; done; echo "Triggering model load with infinite keep_alive...";
      curl -sf -X POST http://ollama:11434/api/generate -H "Content-Type: application/json"
      -d ''{"model":"llava:7b","prompt":"warmup","keep_alive":-1,"stream":false,"options":{"num_predict":1,"num_gpu":999}}''
      > /dev/null; echo "Warmup complete. Model is locked in GPU memory."'
