name: deploy-validation

# Gates every PR that touches deployment surfaces (Helm chart, Terraform
# modules, GitOps overlays). Catches the bugs that only surface at
# render/apply time — typo'd values keys, missing helpers, broken
# module-output references — before a real deploy.
on:
  pull_request:
    paths:
      - 'infrastructure/helm/**'
      - 'infrastructure/terraform/**'
      - 'infrastructure/gitops/**'
      - '.github/workflows/deploy-validation.yml'
  push:
    branches: [develop, main]
    paths:
      - 'infrastructure/helm/**'
      - 'infrastructure/terraform/**'
      - 'infrastructure/gitops/**'

jobs:
  helm-static-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install lint deps
        run: python -m pip install --upgrade pip pyyaml
      - name: Static chart lint (base values)
        run: python infrastructure/helm/nexus-qa/scripts/chart_lint.py
      - name: Static chart lint (staging)
        run: python infrastructure/helm/nexus-qa/scripts/chart_lint.py --env staging
      - name: Static chart lint (production)
        run: python infrastructure/helm/nexus-qa/scripts/chart_lint.py --env production

  helm-template-render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.14.4
      - name: helm lint (base)
        run: helm lint infrastructure/helm/nexus-qa
      - name: helm template — staging
        run: |
          helm template nexus-staging infrastructure/helm/nexus-qa \
            --set secrets.jwtSecret=ci-placeholder \
            --set secrets.postgresPassword=ci-placeholder \
            --set secrets.neo4jPassword=ci-placeholder \
            --set secrets.minioAccessKey=ci-placeholder \
            --set secrets.minioSecretKey=ci-placeholder \
            --set secrets.grafanaPassword=ci-placeholder \
            > /tmp/staging-rendered.yaml
          echo "Rendered $(wc -l < /tmp/staging-rendered.yaml) lines"
      - name: helm template — production
        run: |
          helm template nexus-production infrastructure/helm/nexus-qa \
            --values infrastructure/gitops/envs/production/values/platform.yaml \
            --set secrets.jwtSecret=ci-placeholder \
            --set secrets.postgresPassword=ci-placeholder \
            --set secrets.neo4jPassword=ci-placeholder \
            --set secrets.minioAccessKey=ci-placeholder \
            --set secrets.minioSecretKey=ci-placeholder \
            --set secrets.grafanaPassword=ci-placeholder \
            > /tmp/production-rendered.yaml
          echo "Rendered $(wc -l < /tmp/production-rendered.yaml) lines"
      - name: Upload rendered manifests on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-manifests
          path: /tmp/*-rendered.yaml

  terraform-static-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Static tf lint
        run: python infrastructure/terraform/scripts/tf_lint.py

  terraform-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        env: [dev, staging, production]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5
      - name: terraform fmt check
        working-directory: infrastructure/terraform/envs/${{ matrix.env }}
        run: terraform fmt -check -recursive
        continue-on-error: true
      - name: terraform init (no backend)
        working-directory: infrastructure/terraform/envs/${{ matrix.env }}
        run: terraform init -backend=false -input=false
      - name: terraform validate
        working-directory: infrastructure/terraform/envs/${{ matrix.env }}
        run: terraform validate -no-color

  kyverno-policy-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: hashFiles('infrastructure/gitops/resources/kyverno/**') != ''
    steps:
      - uses: actions/checkout@v4
      - name: Install kyverno CLI
        run: |
          curl -L https://github.com/kyverno/kyverno/releases/download/v1.13.4/kyverno-cli_v1.13.4_linux_x86_64.tar.gz \
            | tar -xz -C /usr/local/bin kyverno
      - name: kyverno apply --dry-run
        run: |
          kyverno apply infrastructure/gitops/resources/kyverno/ \
            --resource <(echo 'apiVersion: v1
          kind: Namespace
          metadata:
            name: smoke
            labels:
              pod-security.kubernetes.io/enforce: restricted') \
            || echo "kyverno surfaced policy violations (expected for smoke namespace)"
