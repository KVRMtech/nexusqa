name: Nexus QA CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ── Python Lint ─────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install lint tools
        run: pip install ruff

      - name: Ruff check (lint + format)
        run: ruff check . --select E,W,F,I --ignore E501

      - name: Ruff format check
        run: ruff format --check .

  # ── Compile Check ───────────────────────────────────────────
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install SDK and light dependencies
        run: |
          pip install -e sdk/nexus-sdk/
          pip install faker jinja2 pytest pytest-asyncio

      - name: Compile all Python files
        run: |
          set -e
          FAIL=0
          for f in $(find . -name '*.py' \
              -not -path './.venv/*' \
              -not -path './alembic/*' \
              -not -path './node_modules/*'); do
            if ! python -m py_compile "$f" 2>/dev/null; then
              echo "FAIL: $f"
              FAIL=1
            fi
          done
          if [ $FAIL -ne 0 ]; then exit 1; fi
          echo "All files compile OK"

  # ── Frontend (TypeScript + React) ───────────────────────────
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npx vitest run

      - name: Build
        run: npm run build

  # ── Unit & Integration Tests ────────────────────────────────
  test:
    runs-on: ubuntu-latest
    needs: [lint, compile]
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e sdk/nexus-sdk/
          pip install \
            pytest pytest-asyncio pytest-cov \
            httpx faker jinja2

      - name: Run tests with coverage
        env:
          NEXUS_REDIS_URL: redis://localhost:6379
          NEXUS_SECRET_KEY: ci-test-secret-key-not-for-prod
          NEXUS_JWT_SECRET: ci-test-jwt-secret-not-for-prod
        run: |
          pytest tests/ \
            --ignore=tests/e2e \
            -v --tb=short \
            --cov=sdk --cov=engines --cov=platform --cov=products \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30

  # ── platform/api suite (the value/outcome oracles, auditor, extractors,
  #    governance contracts) — 300+ tests the root `testpaths = tests` never
  #    collected. Run per-file-isolated so cross-file import pollution can't flap
  #    the result; known runtime regressions are strict-xfail'd (and documented)
  #    in platform/api/tests/conftest.py, so this gate is BLOCKING and honest. ──
  platform-api-tests:
    runs-on: ubuntu-latest
    needs: [lint, compile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e sdk/nexus-sdk/
          ( cd platform/api && pip install -r requirements.txt )
          pip install pytest pytest-asyncio

      - name: platform/api test suite (per-file isolation)
        env:
          NEXUS_SECRET_KEY: ci-test-secret-key-not-for-prod
          NEXUS_JWT_SECRET: ci-test-jwt-secret-not-for-prod
        run: bash ci/run_platform_api_tests.sh

  # ── Docker Build (smoke test) ───────────────────────────────
  docker-build:
    runs-on: ubuntu-latest
    needs: [test, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build base images
        run: |
          docker build -f infrastructure/docker/Dockerfile.base \
            -t nexus-base:ci .
          docker build -f infrastructure/docker/Dockerfile.gpu \
            -t nexus-gpu:ci .
          echo "Base images built"

      - name: Build service images
        run: |
          BUILT=0
          FAILED=0

          build_svc() {
            local name="$1" dir="$2" base="$3"
            echo "Building $name from $dir..."
            if docker build --build-arg BASE_IMAGE="$base" \
                -t "nexus-$name:ci" "$dir"; then
              BUILT=$((BUILT + 1))
            else
              echo "::error::Failed to build $name"
              FAILED=$((FAILED + 1))
            fi
          }

          # CPU engines
          build_svc shield-engine   engines/shield-engine   nexus-base:ci
          build_svc backbone-engine engines/backbone-engine nexus-base:ci
          build_svc nerves-engine   engines/nerves-engine   nexus-base:ci
          build_svc legs-engine     engines/legs-engine     nexus-base:ci
          build_svc hands-engine    engines/hands-engine    nexus-base:ci
          build_svc spine-engine    engines/spine-engine    nexus-base:ci
          build_svc mouth-engine    engines/mouth-engine    nexus-base:ci

          # GPU engines
          build_svc ears-engine  engines/ears-engine  nexus-gpu:ci
          build_svc eyes-engine  engines/eyes-engine  nexus-gpu:ci
          build_svc heart-engine engines/heart-engine nexus-gpu:ci

          # Platform services
          build_svc auth-service  platform/auth-service           nexus-base:ci
          build_svc gateway       platform/gateway                nexus-base:ci
          build_svc platform-api  platform/api                    nexus-base:ci
          build_svc orchestrator  products/nexus-qa-orchestrator  nexus-base:ci

          echo "Built $BUILT image(s), $FAILED failure(s)"
          [ $FAILED -eq 0 ] || exit 1

      - name: Build client image
        run: |
          docker build -f infrastructure/docker/Dockerfile.client \
            -t nexus-client:ci .

      - name: Install Trivy scanner
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin v0.58.2
          trivy --version

      - name: Scan base image for CVEs (Trivy)
        run: |
          trivy image \
            --format table \
            --exit-code 1 \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            nexus-base:ci

      - name: Scan gateway image for CVEs
        if: always()
        run: |
          trivy image \
            --format table \
            --exit-code 0 \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            nexus-gateway:ci

      - name: Generate SBOM (base image)
        if: github.ref == 'refs/heads/main'
        run: |
          trivy image \
            --format cyclonedx \
            --output sbom-base.json \
            nexus-base:ci

      - name: Upload SBOM artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom-base.json
          retention-days: 90

  # ── Security Scan ───────────────────────────────────────────
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies for known vulnerabilities
        run: |
          EXIT=0
          for req in $(find . -name 'requirements.txt' -not -path './.venv/*'); do
            echo "── Auditing $req ──"
            # pip-audit requires packages to be installable; use
            # --strict only when we can resolve the full dep tree.
            pip-audit -r "$req" --desc --output json 2>/dev/null || true
          done
          # Audit the installed SDK directly (most reliable)
          pip install -e sdk/nexus-sdk/ 2>/dev/null
          pip-audit --desc || EXIT=$?
          exit $EXIT
