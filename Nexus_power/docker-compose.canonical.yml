# ═══════════════════════════════════════════════════════════════════════════════
# Nexus QA — Canonical-Only Stack (App Services via Docker)
# ═══════════════════════════════════════════════════════════════════════════════
#
#  Prerequisites: Postgres + Redis running locally (e.g. hybrid-pipeline stack)
#  Neo4j and Ollama are included as Docker services below.
#
#  Start:
#    docker compose -f docker-compose.canonical.yml up -d --build
#
#  Stop:
#    docker compose -f docker-compose.canonical.yml down
#
#  Logs:
#    docker compose -f docker-compose.canonical.yml logs -f
#
# ═══════════════════════════════════════════════════════════════════════════════

x-common-env: &common-env
  NEXUS_ENV: ${NEXUS_ENV:-development}
  NEXUS_PRODUCT_MODE: canonical
  NEXUS_JWT_SECRET: ${NEXUS_JWT_SECRET:?NEXUS_JWT_SECRET must be set to a strong random value (e.g. openssl rand -hex 32) - refusing to start with a published development default}
  JWT_SECRET: ${NEXUS_JWT_SECRET:?NEXUS_JWT_SECRET must be set to a strong random value (e.g. openssl rand -hex 32) - refusing to start with a published development default}
  REDIS_HOST: host.docker.internal
  REDIS_PORT: "6379"
  REDIS_URL: redis://${REDIS_PASSWORD:+:${REDIS_PASSWORD}@}host.docker.internal:6379/0
  POSTGRES_HOST: host.docker.internal
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER:-nexus}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexus-dev}
  POSTGRES_DB: ${POSTGRES_DB:-nexus}
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:-nexus-neo4j-dev}
  LLM_BACKEND: ollama
  OLLAMA_BASE_URL: http://ollama:11434
  EYES_OLLAMA_BASE_URL: http://ollama:11434
  EYES_OLLAMA_MODEL: ${EYES_OLLAMA_MODEL:-llama3.2-vision:11b}
  EYES_FAST_OLLAMA_MODEL: ${EYES_FAST_OLLAMA_MODEL:-llama3.2-vision:11b}
  EARS_DEFAULT_PROCESSING_PROFILE: ${EARS_DEFAULT_PROCESSING_PROFILE:-fast}
  LLM_MAX_TOKENS: "2048"
  GATEWAY_MAX_REQUEST_BODY_MB: "500"
  MAX_REQUEST_BODY_MB: "500"
  HEART_OLLAMA_BASE_URL: http://ollama:11434
  HEART_OLLAMA_MODEL: ${HEART_OLLAMA_MODEL:-llama3.2:1b}
  HEART_TIER3_PROVIDER: ollama
  HEART_TIER3_OLLAMA_BASE_URL: http://ollama:11434
  HEART_TIER3_MODEL: ${HEART_TIER3_MODEL:-llama3.2:1b}
  HEART_TIER3_TIMEOUT: "600"
  HEART_TIER3_MAX_RETRIES: "1"
  BRAIN_OLLAMA_BASE_URL: http://ollama:11434
  BRAIN_OLLAMA_MODEL: ${BRAIN_OLLAMA_MODEL:-llama3.2:1b}
  BRAIN_TIER3_PROVIDER: ollama
  BRAIN_TIER3_OLLAMA_BASE_URL: http://ollama:11434
  BRAIN_TIER3_MODEL: ${BRAIN_TIER3_MODEL:-llama3.2:1b}
  BRAIN_TIER3_TIMEOUT: "780"
  BRAIN_TIER3_MAX_RETRIES: "1"
  OLLAMA_NUM_CTX: "4096"
  WHISPER_FAST_MODEL_SIZE: ${WHISPER_FAST_MODEL_SIZE:-medium}
  WHISPER_FAST_MODEL_PATH: ${WHISPER_FAST_MODEL_PATH:-./models/whisper-medium}
  WHISPER_FAST_COMPUTE_TYPE: ${WHISPER_FAST_COMPUTE_TYPE:-int8}

x-healthcheck: &engine-healthcheck
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 30s

volumes:
  model-cache:
  document-storage:
  upload-storage:
  neo4j-data:
  ollama-models:
  shield-keys:

services:

  # ── Infrastructure ────────────────────────────────────────────

  neo4j:
    image: neo4j:5-community
    container_name: nexus-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-nexus-neo4j-dev}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  ollama:
    image: ollama/ollama:latest
    container_name: nexus-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_NUM_CTX: "4096"
      OLLAMA_KEEP_ALIVE: "5m"
      OLLAMA_MAX_LOADED_MODELS: "1"
    cpus: 2.5
    mem_limit: 5g
    mem_reservation: 1536m
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Build helper ──────────────────────────────────────────────
  base-image:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.base
    image: nexus-base:dev
    container_name: nexus-base-builder
    command: ["echo", "Base image ready"]

  # ── Platform Layer ────────────────────────────────────────────

  auth-service:
    build:
      context: ./platform/auth-service
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: nexus-base:dev
    container_name: nexus-auth
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      <<: *common-env
      ENGINE_PORT: "8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      <<: *engine-healthcheck
    depends_on:
      base-image:
        condition: service_completed_successfully

  gateway:
    build:
      context: ./platform/gateway
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: nexus-base:dev
    container_name: nexus-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      <<: *common-env
      ENGINE_PORT: "8080"
      AUTH_SERVICE_URL: http://auth-service:8000
      SHIELD_ENGINE_URL: http://shield:8001
      EARS_ENGINE_URL: http://ears:8002
      EYES_ENGINE_URL: http://eyes:8003
      SPINE_ENGINE_URL: http://spine:8009
      BRAIN_ENGINE_URL: http://brain:8011
      PLATFORM_API_URL: http://platform-api:8091
      ORCHESTRATOR_URL: http://orchestrator:8100
      # Non-canonical engines point to gateway itself (dead-lettered)
      HEART_ENGINE_URL: http://gateway:8080
      BACKBONE_ENGINE_URL: http://gateway:8080
      NERVES_ENGINE_URL: http://gateway:8080
      LEGS_ENGINE_URL: http://gateway:8080
      HANDS_ENGINE_URL: http://gateway:8080
      MOUTH_ENGINE_URL: http://gateway:8080
      QA_ORCHESTRATOR_URL: http://gateway:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      <<: *engine-healthcheck
    depends_on:
      auth-service:
        condition: service_healthy
      base-image:
        condition: service_completed_successfully

  platform-api:
    build:
      context: ./platform/api
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: nexus-base:dev
    container_name: nexus-platform-api
    restart: unless-stopped
    ports:
      - "8091:8091"
    environment:
      <<: *common-env
      ENGINE_PORT: "8091"
      EARS_ENGINE_URL: http://ears:8002
      EYES_ENGINE_URL: http://eyes:8003
      HEART_ENGINE_URL: http://gateway:8080
      BACKBONE_ENGINE_URL: http://gateway:8080
      SHIELD_ENGINE_URL: http://shield:8001
      NERVES_ENGINE_URL: http://gateway:8080
      HANDS_ENGINE_URL: http://gateway:8080
      LEGS_ENGINE_URL: http://gateway:8080
      SPINE_ENGINE_URL: http://spine:8009
      MOUTH_ENGINE_URL: http://gateway:8080
      BRAIN_ENGINE_URL: http://brain:8011
      GATEWAY_URL: http://gateway:8080
      ORCHESTRATOR_URL: http://orchestrator:8100
      AUTH_SERVICE_URL: http://auth-service:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8091/health"]
      <<: *engine-healthcheck
    depends_on:
      base-image:
        condition: service_completed_successfully

  # ── Canonical Engines ─────────────────────────────────────────

  shield:
    build:
      context: ./engines/shield-engine
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: nexus-base:dev
    container_name: nexus-shield
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - shield-keys:/data/shield
    environment:
      <<: *common-env
      ENGINE_PORT: "8001"
      SHIELD_ENCRYPTION_KEY: ${SHIELD_ENCRYPTION_KEY:-}
      SHIELD_KEY_FILE: /data/shield/.fernet_key
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8001/health"]
      <<: *engine-healthcheck
    depends_on:
      base-image:
        condition: service_completed_successfully

  ears:
    build:
      context: ./engines/ears-engine
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: nexus-base:dev
    container_name: nexus-ears
    restart: unless-stopped
    ports:
      - "8002:8002"
    volumes:
      - model-cache:/app/service/models
    environment:
      <<: *common-env
      ENGINE_PORT: "8002"
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      EARS_DEFAULT_PROCESSING_PROFILE: fast
      EARS_ALLOW_REMOTE_MODEL_BOOTSTRAP: "true"
      EARS_REQUIRE_REAL_DIARIZER: ${EARS_REQUIRE_REAL_DIARIZER:-false}
      EARS_DIARIZER_STARTUP_TIMEOUT_SECONDS: ${EARS_DIARIZER_STARTUP_TIMEOUT_SECONDS:-300}
      EARS_TRANSCRIBER_STARTUP_TIMEOUT_SECONDS: ${EARS_TRANSCRIBER_STARTUP_TIMEOUT_SECONDS:-300}
      WHISPER_FAST_MODEL_SIZE: medium
      WHISPER_FAST_MODEL_PATH: ./models/whisper-medium
      WHISPER_FAST_COMPUTE_TYPE: int8
      PYANNOTE_MODEL_PATH: ./models/pyannote-speaker-3.1
      PYANNOTE_REQUIRE_MANIFEST: ${PYANNOTE_REQUIRE_MANIFEST:-false}
      HF_TOKEN: ${HF_TOKEN:-}
    cpus: 2.0
    mem_limit: 4g
    mem_reservation: 2g
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 15
      start_period: 300s
    depends_on:
      ears-model-init:
        condition: service_completed_successfully
      base-image:
        condition: service_completed_successfully

  ears-model-init:
    build:
      context: ./engines/ears-engine
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: nexus-base:dev
    command: ["python", "scripts/prewarm_models.py", "--mode", "prewarm"]
    working_dir: /app/service
    restart: "no"
    volumes:
      - model-cache:/app/service/models
    environment:
      <<: *common-env
      PYTHONPATH: /app/service
      WHISPER_FAST_MODEL_SIZE: medium
      WHISPER_FAST_MODEL_PATH: ./models/whisper-medium
      WHISPER_MODEL_SIZE: large-v3
      WHISPER_MODEL_PATH: ./models/whisper-large-v3
      WHISPER_PREWARM_COMPUTE_TYPE: int8
      EARS_PREWARM_DIARIZER: ${EARS_PREWARM_DIARIZER:-false}
      PYANNOTE_MODEL_PATH: ./models/pyannote-speaker-3.1
      PYANNOTE_REPO_ID: pyannote/speaker-diarization-3.1
      PYANNOTE_BUNDLE_URI: ${PYANNOTE_BUNDLE_URI:-}
      PYANNOTE_BUNDLE_SHA256: ${PYANNOTE_BUNDLE_SHA256:-}
      PYANNOTE_REQUIRE_MANIFEST: ${PYANNOTE_REQUIRE_MANIFEST:-false}
      HF_TOKEN: ${HF_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      base-image:
        condition: service_completed_successfully

  eyes:
    build:
      context: ./engines/eyes-engine
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: nexus-base:dev
    container_name: nexus-eyes
    restart: unless-stopped
    ports:
      - "8003:8003"
    volumes:
      - model-cache:/app/service/models
    environment:
      <<: *common-env
      ENGINE_PORT: "8003"
      VISION_DEVICE: cpu
      EYES_OCR_GPU: "false"
      EYES_DEFAULT_PROCESSING_PROFILE: fast
      EYES_OCR_ALLOW_REMOTE_MODEL_BOOTSTRAP: "true"
      EYES_OCR_LOAD_TIMEOUT_SECONDS: "120"
      EYES_FAST_MAX_FRAMES: "6"
      EYES_FAST_MAX_SCENES: "4"
      EYES_OCR_MAX_WORKERS: "2"
      EYES_FAST_REPRESENTATIVE_OCR_ONLY: "true"
      EYES_FAST_SKIP_OCR: "false"
    cpus: 2.0
    mem_limit: 3g
    mem_reservation: 1536m
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    depends_on:
      eyes-model-init:
        condition: service_completed_successfully
      base-image:
        condition: service_completed_successfully

  eyes-model-init:
    build:
      context: ./engines/eyes-engine
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: nexus-base:dev
    command: ["python", "scripts/prewarm_models.py", "--mode", "prewarm"]
    restart: "no"
    volumes:
      - model-cache:/app/service/models
    environment:
      <<: *common-env
      EYES_OCR_LANGUAGES: en
      EYES_OCR_MODEL_DIR: ./models/easyocr
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      base-image:
        condition: service_completed_successfully

  spine:
    build:
      context: ./engines/spine-engine
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: nexus-base:dev
    container_name: nexus-spine
    restart: unless-stopped
    volumes:
      - document-storage:/data/nexus/documents
      - upload-storage:/data/nexus/orchestrator/uploads
    ports:
      - "8009:8009"
    environment:
      <<: *common-env
      ENGINE_PORT: "8009"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8009/health"]
      <<: *engine-healthcheck
    depends_on:
      base-image:
        condition: service_completed_successfully

  brain:
    build:
      context: ./engines/brain-engine
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: nexus-base:dev
    container_name: nexus-brain
    restart: unless-stopped
    ports:
      - "8011:8011"
    environment:
      <<: *common-env
      ENGINE_PORT: "8011"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8011/health"]
      <<: *engine-healthcheck
    depends_on:
      base-image:
        condition: service_completed_successfully

  # ── Orchestrator ──────────────────────────────────────────────

  orchestrator:
    build:
      context: ./products/nexus-qa-orchestrator
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: nexus-base:dev
    container_name: nexus-orchestrator
    restart: unless-stopped
    volumes:
      - upload-storage:/data/nexus/orchestrator/uploads
    ports:
      - "8100:8100"
    environment:
      <<: *common-env
      ENGINE_PORT: "8100"
      SHIELD_ENGINE_URL: http://shield:8001
      EARS_ENGINE_URL: http://ears:8002
      EYES_ENGINE_URL: http://eyes:8003
      SPINE_ENGINE_URL: http://spine:8009
      BRAIN_ENGINE_URL: http://brain:8011
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8100/health"]
      <<: *engine-healthcheck
    depends_on:
      base-image:
        condition: service_completed_successfully

  # ── UI Client ─────────────────────────────────────────────────

  client:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.client
      args:
        VITE_API_BASE: /api
        VITE_PRODUCT_MODE: canonical
    container_name: nexus-client
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-3000}:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      gateway:
        condition: service_healthy
