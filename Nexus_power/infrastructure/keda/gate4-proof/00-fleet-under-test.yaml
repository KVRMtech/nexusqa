# ═══════════════════════════════════════════════════════════════════════════
# A31 — the cluster-side scaffolding the repository's ScaledObject expects.
#
# The point of this file is that the PRODUCTION manifest
# (infrastructure/keda/qe-explorer-scaledobject.yaml) is applied UNCHANGED. It
# names four things it does not create:
#
#   Deployment  nexus/qe-explorer                       ← scaleTargetRef
#   Service     monitoring/prometheus-operated:9090     ← trigger serverAddress
#   Secret      nexus/qec-prometheus  key bearer-token  ← TriggerAuthentication
#   metrics     qec_crawl_queue_depth
#               qec_crawl_queue_oldest_wait_seconds     ← the trigger queries
#
# So they are created here, with the names and ports the manifest already
# assumes. Nothing in the production manifest is edited to make this work — if
# a name here is wrong, KEDA fails to resolve the trigger and the proof fails,
# which is the correct outcome.
#
# WHAT IS REAL, AND WHAT IS NOT — STATED PLAINLY
# ==============================================
# REAL: the cluster, the KEDA operator, the ScaledObject, the HPA KEDA creates
# from it, the Prometheus that answers the trigger query, the scrape, the
# scheduler, the kubelet, and the pods that actually get placed on a node.
#
# NOT REAL: the queue itself. `qec_crawl_queue_depth` is published here by a
# stand-in exporter whose value is a file this proof writes, rather than by
# qe-central's `queue_drainer._publish_fleet_metrics` tick. And the scaled
# workload is a sleeping container, not the 3 GB Playwright explorer image —
# running twenty of those on the proof machine is what a maxReplicaCount of 20
# would actually attempt.
#
# That boundary is deliberate and it is the honest one: what A31 has to prove is
# that QUEUE DEPTH DRIVES REPLICAS THROUGH KEDA ON A REAL CLUSTER. The metric's
# publisher and the container's payload are upstream and downstream of that
# loop respectively; the loop itself is exercised end to end with nothing faked
# inside it.
# ═══════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Namespace
metadata:
  name: nexus
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
# ── The bearer token the production TriggerAuthentication demands ───────────
# KEDA resolves this secret before it will evaluate the trigger at all, so its
# presence is part of what the proof exercises.
apiVersion: v1
kind: Secret
metadata:
  name: qec-prometheus
  namespace: nexus
type: Opaque
stringData:
  bearer-token: "gate4-a31-proof-token-not-a-credential"
---
# ── The fleet metrics exporter (stands in for the drain tick) ───────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: queue-exporter-src
  namespace: monitoring
data:
  exporter.py: |
    """Serve the two gauges the ScaledObject queries, from files on disk.

    Reading the value per request (rather than holding it in memory) is what
    lets the proof change queue depth with a single `kubectl exec ... > /data/depth`
    and have the very next scrape observe it.

    The gauges are exported EVEN AT ZERO. An absent series reads to a scaler as
    "no data", which is not "no backlog" — that distinction is the reason the
    production manifest's comment insists on it, so the stand-in honours it.
    """
    import http.server

    def read(path, default="0"):
        try:
            with open(path) as fh:
                return fh.read().strip() or default
        except Exception:
            return default

    class Handler(http.server.BaseHTTPRequestHandler):
        def do_GET(self):
            depth = read("/data/depth")
            wait = read("/data/wait")
            body = (
                "# HELP qec_crawl_queue_depth Crawls waiting for a worker.\n"
                "# TYPE qec_crawl_queue_depth gauge\n"
                f"qec_crawl_queue_depth {depth}\n"
                "# HELP qec_crawl_queue_oldest_wait_seconds Age of the oldest queued crawl.\n"
                "# TYPE qec_crawl_queue_oldest_wait_seconds gauge\n"
                f"qec_crawl_queue_oldest_wait_seconds {wait}\n"
            ).encode()
            self.send_response(200)
            self.send_header("Content-Type", "text/plain; version=0.0.4")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def log_message(self, *args):
            pass

    http.server.HTTPServer(("", 9109), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: queue-exporter
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels: {app: queue-exporter}
  template:
    metadata:
      labels: {app: queue-exporter}
    spec:
      containers:
        - name: exporter
          image: python:3.11-alpine
          command: ["python", "/src/exporter.py"]
          ports: [{containerPort: 9109, name: metrics}]
          volumeMounts:
            - {name: src, mountPath: /src}
            - {name: data, mountPath: /data}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
      volumes:
        - name: src
          configMap: {name: queue-exporter-src}
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: queue-exporter
  namespace: monitoring
spec:
  selector: {app: queue-exporter}
  ports: [{port: 9109, targetPort: 9109, name: metrics}]
---
# ── Prometheus, at the exact address the production trigger names ───────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
    scrape_configs:
      - job_name: qec-fleet
        static_configs:
          - targets: ["queue-exporter.monitoring.svc:9109"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels: {app: prometheus}
  template:
    metadata:
      labels: {app: prometheus}
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.retention.time=1h
            - --web.enable-lifecycle
          ports: [{containerPort: 9090, name: web}]
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
      volumes:
        - name: config
          configMap: {name: prometheus-config}
---
# The Service name the production ScaledObject hard-codes.
apiVersion: v1
kind: Service
metadata:
  name: prometheus-operated
  namespace: monitoring
spec:
  selector: {app: prometheus}
  ports: [{port: 9090, targetPort: 9090, name: web}]
---
# ── The scale target ───────────────────────────────────────────────────────
# Named `qe-explorer` in namespace `nexus` because that is what the production
# ScaledObject's scaleTargetRef resolves; KEDA refuses the ScaledObject outright
# if this Deployment is absent, so its identity is load-bearing for the proof.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qe-explorer
  namespace: nexus
  labels: {app: qe-explorer}
spec:
  replicas: 1
  selector:
    matchLabels: {app: qe-explorer}
  template:
    metadata:
      labels: {app: qe-explorer}
    spec:
      containers:
        - name: explorer
          image: busybox:1.36
          command: ["sh", "-c", "trap : TERM INT; sleep infinity & wait"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
          # PER-POD EGRESS FENCE. T-FL-04 refuses any worker that SHARES an
          # allowlist file with another, so the fence must never be a
          # ReadWriteMany mount. An emptyDir is pod-local by construction,
          # which is the property that makes horizontal scaling safe here.
          volumeMounts:
            - {name: egress-fence, mountPath: /qec/egress-allowlist}
      volumes:
        - name: egress-fence
          emptyDir: {}
