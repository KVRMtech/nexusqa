# KEDA ScaledObjects for the Nexus QA canonical pipeline.
#
# Phase 6 foundation: each engine lane has TWO scaler targets — one
# for the standard queue and one for the priority queue (see
# nexus_sdk.workflows.dispatch.queue_name). The priority lane is
# bound to a separate Deployment so premium-tenant traffic can scale
# independently of the standard pool.
#
# Triggers use Redis Streams XLEN as the load signal:
#   - HPA scales to 0 when depth=0 for 5 min (cooldownPeriod).
#   - Scales up when depth exceeds messagesPerReplica.
#
# Apply after KEDA itself is installed (helm install keda kedacore/keda).
#
# Deployment naming convention this file assumes:
#   nexus-{engine}-{kind}            → standard lane worker
#   nexus-{engine}-{kind}-priority   → priority lane worker
#
# Triggers reference the same Redis address as the orchestrator (db 3,
# matching QueueConfig.redis_db). Update the TriggerAuth section with
# your secret name.

---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: nexus-redis-auth
  namespace: nexus
spec:
  secretTargetRef:
    - parameter: password
      name: nexus-redis
      key: redis-password

---
# ─── Eyes engine (GPU-heavy) ────────────────────────────────────
# Standard pool. Modest min replicas to absorb a small backlog
# without a cold-start tax.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: nexus-eyes-gpu-standard
  namespace: nexus
spec:
  scaleTargetRef:
    name: nexus-eyes-gpu
  minReplicaCount: 1
  maxReplicaCount: 6
  pollingInterval: 15
  cooldownPeriod: 300
  triggers:
    - type: redis-streams
      metadata:
        address: nexus-redis:6379
        stream: nexus:queue:eyes.gpu
        consumerGroup: nexus:workers:eyes.gpu
        pendingEntriesCount: "8"   # PEL threshold per replica
        databaseIndex: "3"
      authenticationRef:
        name: nexus-redis-auth

---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: nexus-eyes-gpu-priority
  namespace: nexus
spec:
  scaleTargetRef:
    name: nexus-eyes-gpu-priority
  minReplicaCount: 1
  maxReplicaCount: 12
  pollingInterval: 10
  cooldownPeriod: 180
  triggers:
    - type: redis-streams
      metadata:
        address: nexus-redis:6379
        stream: nexus:queue:eyes.gpu.priority
        consumerGroup: nexus:workers:eyes.gpu.priority
        pendingEntriesCount: "4"
        databaseIndex: "3"
      authenticationRef:
        name: nexus-redis-auth

