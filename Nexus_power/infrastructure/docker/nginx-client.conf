server {
    listen 80;
    server_name _;

    # Use Docker's embedded DNS so upstream IPs are re-resolved after container restarts
    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing — all non-file requests go to index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }

    # Proxy API calls to gateway.
    #
    # `^~` makes this prefix match take precedence over any regex
    # location, so /api/v1/eyes/frames/<path>/frame_00007.png is
    # proxied even though the URI ends in .png.  Without this,
    # nginx's regex-over-prefix precedence would route image-serving
    # API endpoints into the static-asset block below and return
    # 404 (file not on the SPA filesystem).
    location ^~ /api/ {
        set $gateway http://gateway:8080;
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_buffering off;
        client_max_body_size 500m;
    }

    # Cache static assets — scoped to /assets/ so this regex does not
    # shadow API endpoints that happen to serve PNG/JPEG bodies
    # (e.g. /api/v1/.../annotated.png, /api/v1/eyes/frames/.../foo.png).
    location ~* ^/assets/.+\.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy strict-origin-when-cross-origin;
}
