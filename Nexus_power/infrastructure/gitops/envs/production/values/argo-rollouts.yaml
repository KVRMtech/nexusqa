controller:
  replicas: 3
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      memory: 1Gi

# Production has a dashboard exposed via authenticated ingress (separate
# Ingress object created by the infra-resources ApplicationSet).
dashboard:
  enabled: true
  replicas: 2
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
