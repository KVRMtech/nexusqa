# IRSA role ARN — Terraform output `eso_role_arn` from
# infrastructure/terraform/envs/production. After `terraform apply`,
# replace the placeholder with `$(terraform output -raw eso_role_arn)`
# and commit. Argo CD picks up the change and patches the SA on next
# sync.
serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: REPLACE_WITH_PRODUCTION_ESO_ROLE_ARN

# Higher concurrency for the production secret population.
concurrent: 25

# Tighter resource requests in production — actual usage is steady so
# request matches limit for the controller to avoid eviction surprises.
resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    memory: 384Mi
