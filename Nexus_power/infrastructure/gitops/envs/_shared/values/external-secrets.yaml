# External Secrets Operator — shared baseline.
#
# Bridges the cluster's KMS / secret-manager (AWS Secrets Manager, GCP
# Secret Manager, Azure Key Vault, HashiCorp Vault) into Kubernetes
# Secret objects that the platform Helm chart references by name.
#
# The actual ClusterSecretStore (cloud-binding) lives in infra-resources
# because it needs the cloud-specific identity wired in per env.

installCRDs: true

replicaCount: 2

# Run unprivileged.
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  seccompProfile:
    type: RuntimeDefault
podSecurityContext:
  runAsNonRoot: true
  fsGroup: 1000

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    memory: 256Mi

# ServiceAccount with the annotation slot left open per env. The actual
# annotation (IRSA role ARN, Workload Identity binding, Azure UAMI) is
# applied in the per-env override file.
serviceAccount:
  create: true
  name: external-secrets
  annotations: {}

# Concurrent refreshes per secret store. Higher in production where many
# secrets refresh on the same interval.
concurrent: 10

# Webhook for CRD validation
webhook:
  create: true
  replicaCount: 2
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi

# Cert controller (issues the webhook cert internally)
certController:
  create: true
  replicaCount: 2
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi

# Prometheus
serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s
  additionalLabels:
    release: kube-prometheus-stack

# Topology spread
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: external-secrets
