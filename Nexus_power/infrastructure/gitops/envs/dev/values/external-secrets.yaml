# Dev override for ESO: bind the operator's ServiceAccount to the cloud
# identity that grants read access to dev secrets in the cloud KMS.
#
# The annotation key depends on the cloud:
#   AWS:    eks.amazonaws.com/role-arn
#   GCP:    iam.gke.io/gcp-service-account
#   Azure:  azure.workload.identity/client-id
#
# Terraform (M0.7) emits the actual ARN/binding into a ConfigMap that the
# CI promotion step substitutes into this file before merge. Until M0.7,
# the placeholder below is replaced manually by the operator running the
# initial bootstrap.
serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: REPLACE_WITH_DEV_ESO_ROLE_ARN

# Lower concurrency in dev (less secret traffic)
concurrent: 5
