# Webhook tokens for the argo-rollouts notification controller.
#
# Format expected by argo-rollouts:
#   apiVersion: v1
#   kind: Secret
#   metadata:
#     name: argo-rollouts-notification-secret
#     namespace: argo-rollouts
#   data:
#     slackToken: <base64-bot-token>
#     pagerdutyToken: <base64-integration-key>
#
# The Secret is owned by ESO, not by this chart, because the rollouts
# controller lives in its own namespace (argo-rollouts) and reads the
# Secret named exactly `argo-rollouts-notification-secret`. The remote
# keys follow the platform's standard naming convention.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: argo-rollouts-notification-secret
  namespace: argo-rollouts
  labels:
    nexus-qa.io/category: argo-rollouts
spec:
  refreshInterval: 1h
  secretStoreRef:
    # Same cluster-wide store as the platform Helm chart. Both consume
    # nexus-platform-${PLATFORM_ENV}; the store's tag scoping prevents
    # one namespace from reading another's keys.
    name: nexus-platform-${PLATFORM_ENV}
    kind: ClusterSecretStore
  target:
    name: argo-rollouts-notification-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      mergePolicy: Replace
      engineVersion: v2
  data:
    - secretKey: slackToken
      remoteRef:
        key: nexus-qa/argo-rollouts-slack-token
    - secretKey: pagerdutyToken
      remoteRef:
        key: nexus-qa/argo-rollouts-pagerduty-token
