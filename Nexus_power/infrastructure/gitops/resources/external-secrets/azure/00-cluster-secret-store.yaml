# Azure Key Vault binding for the {env} cluster.
#
# Identity model: Workload Identity Federation (AKS OIDC issuer).
# The User-Assigned Managed Identity behind the federation has the
# "Key Vault Secrets User" role on the keyvault below, plus
# "Key Vault Crypto User" if Key Vault CMK encryption is in use.
#
# KMS binding: Azure Key Vault holds the platform's secrets directly;
# the vault's encryption is HSM-backed and rotation-transparent. The
# vault access policies and RBAC role assignments are managed by
# Terraform.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: nexus-platform-${PLATFORM_ENV}
  labels:
    nexus-qa.io/cloud: azure
    nexus-qa.io/env: ${PLATFORM_ENV}
  annotations:
    azure.workload.identity/client-id: ${AZURE_CLIENT_ID}
    azure.workload.identity/tenant-id: ${AZURE_TENANT_ID}
spec:
  provider:
    azurekv:
      tenantId: ${AZURE_TENANT_ID}
      vaultUrl: https://${AZURE_KEYVAULT_NAME}.vault.azure.net
      authType: WorkloadIdentity
      serviceAccountRef:
        name: external-secrets
        namespace: external-secrets
  refreshInterval: 10m
  conditions:
    - namespaceSelector:
        matchLabels:
          pod-security.kubernetes.io/enforce: restricted
