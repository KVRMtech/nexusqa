# AWS Secrets Manager binding for the {env} cluster.
#
# Identity model: IRSA. The ServiceAccount external-secrets/external-secrets
# is annotated (per-env) with the IAM role ARN that has
# secretsmanager:GetSecretValue and kms:Decrypt on the platform's CMK.
# The role's trust policy restricts assumption to this specific
# OIDC issuer + SA — no static credentials anywhere.
#
# KMS binding: Secrets Manager uses the customer-managed KMS key
# nexus-platform-${PLATFORM_ENV}-secrets (created by Terraform in M0.7).
# Rotation cadence: AWS-managed yearly key rotation + per-secret rotation
# Lambda (cadence depends on secret class; see rotation runbook).
#
# Scoping: an IAM tag policy restricts visibility to secrets tagged
#   nexus:env=${PLATFORM_ENV}
# This file is reused unchanged across envs; the ${PLATFORM_ENV} and
# ${PRIMARY_REGION} placeholders are substituted by Argo CD via
# kustomize replacement / per-env values overlay.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: nexus-platform-${PLATFORM_ENV}
  labels:
    nexus-qa.io/cloud: aws
    nexus-qa.io/env: ${PLATFORM_ENV}
spec:
  provider:
    aws:
      service: SecretsManager
      region: ${PRIMARY_REGION}
      # AWS Secrets Manager already encrypts with the bound KMS key;
      # ESO performs Decrypt on read. No additional crypto layer here.
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
      # Optional: prefix every fetch with this path so a misconfigured
      # ExternalSecret cannot reach arbitrary secrets in the account.
      # The platform's secret naming convention is
      #   /nexus-platform/${PLATFORM_ENV}/<key>
      # The chart's externalSecrets.remoteKeyPrefix must match.
      additionalRoles: []
  refreshInterval: 10m   # validate cluster connectivity each tick
  conditions:
    - namespaceSelector:
        matchLabels:
          pod-security.kubernetes.io/enforce: restricted
