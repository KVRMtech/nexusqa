# GCP Secret Manager binding for the {env} cluster.
#
# Identity model: Workload Identity. The GSA bound to the
# external-secrets KSA holds roles/secretmanager.secretAccessor on
# secrets labeled nexus_env=${PLATFORM_ENV}, and roles/cloudkms.decrypter
# on the platform's CMEK ring.
#
# KMS binding: Secret Manager CMEK-encrypts payloads with the key ring
# projects/${GCP_PROJECT_ID}/locations/${PRIMARY_REGION}/keyRings/nexus-platform
# /cryptoKeys/secrets-${PLATFORM_ENV}. Auto-rotation is set to 90 days
# in Terraform; this binding is rotation-transparent.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: nexus-platform-${PLATFORM_ENV}
  labels:
    nexus-qa.io/cloud: gcp
    nexus-qa.io/env: ${PLATFORM_ENV}
spec:
  provider:
    gcpsm:
      projectID: ${GCP_PROJECT_ID}
      auth:
        workloadIdentity:
          clusterLocation: ${PRIMARY_REGION}
          clusterName: ${GKE_CLUSTER_NAME}
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
  refreshInterval: 10m
  conditions:
    - namespaceSelector:
        matchLabels:
          pod-security.kubernetes.io/enforce: restricted
