# HashiCorp Vault binding (KV v2) for the {env} cluster.
#
# Identity model: Kubernetes auth method. The role
# nexus-platform-${PLATFORM_ENV} is bound to the external-secrets
# ServiceAccount and permits the policy
#   path "secret/data/nexus-platform/${PLATFORM_ENV}/*" { capabilities = ["read"] }
#
# Vault-side encryption: the secret backend uses Vault's own seal
# (Transit / AWS-KMS / Azure-KV / Cloud-HSM depending on install).
# Rotation cadence is governed by the seal type's host KMS.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: nexus-platform-${PLATFORM_ENV}
  labels:
    nexus-qa.io/cloud: vault
    nexus-qa.io/env: ${PLATFORM_ENV}
spec:
  provider:
    vault:
      server: ${VAULT_ADDR}
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: nexus-platform-${PLATFORM_ENV}
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
      # mTLS to Vault uses the cluster CA bundle — ESO reads it from
      # the standard ca-bundle ConfigMap injected by the cluster.
      caProvider:
        type: ConfigMap
        name: kube-root-ca.crt
        key: ca.crt
        namespace: external-secrets
  refreshInterval: 10m
  conditions:
    - namespaceSelector:
        matchLabels:
          pod-security.kubernetes.io/enforce: restricted
