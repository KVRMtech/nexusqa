# Every Deployment in platform namespaces with replicas > 1 must have a
# matching PodDisruptionBudget. Cluster autoscaler and rolling drains
# respect PDBs; without one, a scale-down can take all replicas down.
#
# Audit-only initially so we get a report of every Deployment missing
# its PDB before flipping to Enforce in production.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-pdb-for-multi-replica-deployments
  annotations:
    policies.kyverno.io/title: Require PodDisruptionBudget for multi-replica Deployments
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Deployment
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: deployment-must-have-pdb
      match:
        any:
          - resources:
              kinds: [Deployment]
              namespaceSelector:
                matchLabels:
                  pod-security.kubernetes.io/enforce: restricted
      preconditions:
        all:
          - key: "{{ request.object.spec.replicas || `1` }}"
            operator: GreaterThan
            value: 1
      context:
        - name: pdbs
          apiCall:
            urlPath: "/apis/policy/v1/namespaces/{{ request.namespace }}/poddisruptionbudgets"
            jmesPath: "items[?spec.selector.matchLabels.\"app.kubernetes.io/component\"=='{{ request.object.metadata.labels.\"app.kubernetes.io/component\" || '' }}'] | length(@)"
      validate:
        message: >-
          Deployment '{{ request.object.metadata.name }}' has replicas > 1
          but no PodDisruptionBudget matches its component label. Add a
          PDB to protect availability during node drains.
        deny:
          conditions:
            all:
              - key: "{{ pdbs }}"
                operator: Equals
                value: 0
