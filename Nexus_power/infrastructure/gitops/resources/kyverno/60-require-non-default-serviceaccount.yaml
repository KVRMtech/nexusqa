# Every pod must run under an explicit ServiceAccount, not the namespace
# `default` SA. The default SA accumulates RBAC bindings from any tooling
# that targets the namespace; tying every pod to an explicit SA makes
# RBAC scope auditable.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-explicit-serviceaccount
  annotations:
    policies.kyverno.io/title: Require explicit ServiceAccount
    policies.kyverno.io/category: RBAC
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: not-default-serviceaccount
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaceSelector:
                matchLabels:
                  pod-security.kubernetes.io/enforce: restricted
      validate:
        message: >-
          Pods must specify a non-default ServiceAccount. The default SA
          accumulates implicit permissions; explicit SAs make RBAC
          surfaces auditable.
        pattern:
          spec:
            =(serviceAccountName): "!default"
