# Cluster resources that depend on the infra controllers being installed.
#
# Examples: ClusterIssuer needs cert-manager CRDs; ClusterSecretStore
# needs ESO CRDs; the Linkerd trust anchor Certificate needs both.
#
# Sync wave 5 ensures these apply AFTER the controllers (waves -3 to 0).
#
# Each cluster gets the resources for its env via the cluster generator
# plus a list generator over resource categories.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: infra-resources
  namespace: argocd
spec:
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
                matchExpressions:
                  - key: env
                    operator: In
                    values: [dev, staging, production]
          - list:
              elements:
                - category: cert-manager
                  pathSuffix: cert-manager
                  targetNamespace: cert-manager
                  syncWave: "5"
                - category: linkerd-identity
                  pathSuffix: linkerd
                  targetNamespace: linkerd
                  syncWave: "6"
                # External-secrets CSS manifests are now sharded by cloud
                # provider. The {{cloud}} label on the cluster Secret picks
                # the active store (aws|gcp|azure|vault). Always-on items
                # live in the `common/` subdir.
                - category: external-secrets-common
                  pathSuffix: external-secrets/common
                  targetNamespace: external-secrets
                  syncWave: "7"
                - category: external-secrets-provider
                  pathSuffix: external-secrets/{{cloud}}
                  targetNamespace: external-secrets
                  syncWave: "7"
                - category: argo-rollouts
                  pathSuffix: argo-rollouts
                  targetNamespace: argo-rollouts
                  syncWave: "8"
                - category: kyverno-policies
                  pathSuffix: kyverno
                  targetNamespace: kyverno
                  syncWave: "9"
  template:
    metadata:
      name: 'res-{{category}}-{{name}}'
      annotations:
        argocd.argoproj.io/sync-wave: '{{syncWave}}'
    spec:
      project: infra
      sources:
        - repoURL: ${PLATFORM_REPO_URL}
          targetRevision: '{{metadata.annotations.platform-target-revision}}'
          path: infrastructure/gitops/resources/{{pathSuffix}}
          directory:
            recurse: true
            include: '*.yaml'
        - repoURL: ${PLATFORM_REPO_URL}
          targetRevision: '{{metadata.annotations.platform-target-revision}}'
          ref: values
      destination:
        server: '{{server}}'
        namespace: '{{targetNamespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=false
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
        retry:
          limit: 10
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 10m
