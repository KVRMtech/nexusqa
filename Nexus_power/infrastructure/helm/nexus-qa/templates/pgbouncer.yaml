{{/*
=================================================================
PgBouncer — PostgreSQL Connection Pooler
=================================================================
Transaction-mode connection pooler deployed as a Deployment + Service.
All services connect to PgBouncer instead of PostgreSQL directly.

Benefits at 100+ customers:
  - Limits actual PostgreSQL connections to pool_size (default 100)
  - Each service can open many connections without exhausting PG
  - ~600 SQLAlchemy connections (15 services × 30 each) collapsed
    down to 100 real PG connections
  - Transaction-mode: connections returned after each transaction

Only deployed when pgbouncer.enabled=true.
*/}}

{{- if (index .Values "pgbouncer" | default dict).enabled }}

{{- $fullname := include "nexus-qa.fullname" . }}
{{- $root := . }}
{{- $pgbouncer := index .Values "pgbouncer" }}

---
# ── PgBouncer ConfigMap ───────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-pgbouncer-config
  labels:
    {{- include "nexus-qa.componentLabels" (dict "root" $root "component" "pgbouncer") | nindent 4 }}
data:
  pgbouncer.ini: |
    [databases]
    {{- $pgHost := printf "%s-postgres" $fullname }}
    {{- $pgPort := .Values.postgres.port | default 5432 }}
    {{- $pgDb := .Values.postgres.database | default "nexusqa" }}
    {{ $pgDb }} = host={{ $pgHost }} port={{ $pgPort }} dbname={{ $pgDb }}
    * = host={{ $pgHost }} port={{ $pgPort }}

    [pgbouncer]
    listen_addr = 0.0.0.0
    listen_port = {{ $pgbouncer.port | default 6432 }}
    auth_type = md5
    auth_file = /etc/pgbouncer/userlist.txt

    ; Pool mode: transaction is best for async SQLAlchemy + multi-tenant
    pool_mode = {{ $pgbouncer.poolMode | default "transaction" }}

    ; Pool sizing
    default_pool_size = {{ $pgbouncer.defaultPoolSize | default 100 }}
    min_pool_size = {{ $pgbouncer.minPoolSize | default 10 }}
    max_client_conn = {{ $pgbouncer.maxClientConn | default 1000 }}
    reserve_pool_size = {{ $pgbouncer.reservePoolSize | default 5 }}
    reserve_pool_timeout = 3

    ; Timeouts
    server_idle_timeout = {{ $pgbouncer.serverIdleTimeout | default 300 }}
    server_lifetime = {{ $pgbouncer.serverLifetime | default 3600 }}
    server_connect_timeout = 5
    server_login_retry = 3
    client_idle_timeout = {{ $pgbouncer.clientIdleTimeout | default 0 }}
    query_timeout = {{ $pgbouncer.queryTimeout | default 120 }}
    query_wait_timeout = {{ $pgbouncer.queryWaitTimeout | default 30 }}

    ; Logging
    log_connections = 0
    log_disconnections = 0
    log_pooler_errors = 1
    stats_period = 60

    ; Admin console
    admin_users = {{ .Values.postgres.user | default "nexus" }}
    stats_users = {{ .Values.postgres.user | default "nexus" }}

    ; TLS (optional)
    {{- if $pgbouncer.serverTLS | default false }}
    server_tls_sslmode = require
    {{- end }}

  userlist.txt: |
    "{{ .Values.postgres.user | default "nexus" }}" "$(PG_PASSWORD)"

---
# ── PgBouncer Deployment ──────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-pgbouncer
  labels:
    {{- include "nexus-qa.componentLabels" (dict "root" $root "component" "pgbouncer") | nindent 4 }}
spec:
  replicas: {{ $pgbouncer.replicas | default 2 }}
  selector:
    matchLabels:
      {{- include "nexus-qa.componentSelectorLabels" (dict "root" $root "component" "pgbouncer") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nexus-qa.componentLabels" (dict "root" $root "component" "pgbouncer") | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ $pgbouncer.metricsPort | default 9127 }}"
    spec:
      securityContext:
        runAsUser: 70
        runAsGroup: 70
        runAsNonRoot: true
      initContainers:
        - name: render-userlist
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              sed "s/\$(PG_PASSWORD)/$PG_PASSWORD/g" /config-template/userlist.txt > /config/userlist.txt
              cp /config-template/pgbouncer.ini /config/pgbouncer.ini
              chmod 600 /config/userlist.txt
          env:
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "nexus-qa.secretName" $root }}
                  key: postgres-password
          volumeMounts:
            - name: config-template
              mountPath: /config-template
            - name: config
              mountPath: /config
      containers:
        - name: pgbouncer
          image: {{ $pgbouncer.image | default "bitnami/pgbouncer:1.22.1" }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          env:
            - name: PGBOUNCER_CONF_FILE
              value: /etc/pgbouncer/pgbouncer.ini
            - name: PGBOUNCER_AUTH_FILE
              value: /etc/pgbouncer/userlist.txt
          ports:
            - name: pgbouncer
              containerPort: {{ $pgbouncer.port | default 6432 }}
              protocol: TCP
          resources:
            {{- toYaml ($pgbouncer.resources | default (dict "requests" (dict "cpu" "100m" "memory" "64Mi") "limits" (dict "cpu" "500m" "memory" "256Mi"))) | nindent 12 }}
          livenessProbe:
            tcpSocket:
              port: {{ $pgbouncer.port | default 6432 }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: {{ $pgbouncer.port | default 6432 }}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - name: config
              mountPath: /etc/pgbouncer
              readOnly: true

        {{- if $pgbouncer.metrics | default false }}
        # Prometheus exporter sidecar for PgBouncer stats
        - name: metrics
          image: prometheuscommunity/pgbouncer-exporter:v0.7.0
          args:
            - "--pgBouncer.connectionString=postgres://{{ .Values.postgres.user | default "nexus" }}:$(PG_PASSWORD)@localhost:{{ $pgbouncer.port | default 6432 }}/pgbouncer?sslmode=disable"
          env:
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "nexus-qa.secretName" $root }}
                  key: postgres-password
          ports:
            - name: metrics
              containerPort: {{ $pgbouncer.metricsPort | default 9127 }}
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
        {{- end }}

      volumes:
        - name: config-template
          configMap:
            name: {{ $fullname }}-pgbouncer-config
        - name: config
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi

---
# ── PgBouncer Service ─────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-pgbouncer
  labels:
    {{- include "nexus-qa.componentLabels" (dict "root" $root "component" "pgbouncer") | nindent 4 }}
  annotations:
    {{- if $pgbouncer.metrics | default false }}
    prometheus.io/scrape: "true"
    prometheus.io/port: "{{ $pgbouncer.metricsPort | default 9127 }}"
    {{- end }}
spec:
  type: ClusterIP
  ports:
    - port: {{ $pgbouncer.port | default 6432 }}
      targetPort: pgbouncer
      protocol: TCP
      name: pgbouncer
    {{- if $pgbouncer.metrics | default false }}
    - port: {{ $pgbouncer.metricsPort | default 9127 }}
      targetPort: metrics
      protocol: TCP
      name: metrics
    {{- end }}
  selector:
    {{- include "nexus-qa.componentSelectorLabels" (dict "root" $root "component" "pgbouncer") | nindent 4 }}

{{- end }}
