{{/*
=================================================================
HorizontalPodAutoscalers for platform services + orchestrator
=================================================================
Engine HPA can be added per-engine if needed; platform services
benefit most from auto-scaling.
*/}}

{{- $fullname := include "nexus-qa.fullname" . }}
{{- $root := . }}

{{/* ═══════ Auth Service HPA ═══════ */}}
{{- if .Values.authService.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $fullname }}-auth
  labels:
    {{- include "nexus-qa.componentLabels" (dict "root" $root "component" "auth") | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $fullname }}-auth
  minReplicas: {{ .Values.authService.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.authService.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.authService.autoscaling.targetCPU }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 2
          periodSeconds: 30
      selectPolicy: Max
{{- end }}

