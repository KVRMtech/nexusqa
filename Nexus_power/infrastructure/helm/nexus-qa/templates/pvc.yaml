{{/*
=================================================================
PersistentVolumeClaims — only emitted for engines that opt into
mode: pvc.  Default (mode: emptyDir) makes engines stateless and
the canonical store is object storage (see values.yaml storage.*).
=================================================================
*/}}

{{/* ── Model Cache (shared RWX) ── */}}
{{- if .Values.modelCache.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "nexus-qa.fullname" . }}-model-cache
  labels:
    {{- include "nexus-qa.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.modelCache.accessMode | default "ReadWriteMany" }}
  {{- if .Values.global.storageClass }}
  storageClassName: {{ .Values.global.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.modelCache.size }}
{{- end }}

{{/* ── Ears Audio Storage (PVC mode only) ── */}}
{{- if and .Values.engines.ears.enabled (eq (dig "persistence" "audio" "mode" "emptyDir" .Values.engines.ears) "pvc") }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "nexus-qa.fullname" . }}-audio-storage
  labels:
    {{- include "nexus-qa.componentLabels" (dict "root" . "component" "ears-engine") | nindent 4 }}
    nexus-qa.io/storage-mode-pvc-opt-in: "true"
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.global.storageClass }}
  storageClassName: {{ .Values.global.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.engines.ears.persistence.audio.size }}
{{- end }}

