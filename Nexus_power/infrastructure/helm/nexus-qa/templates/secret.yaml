{{/*
=================================================================
Secret — credentials for all services

When externalSecrets.enabled is true, the ExternalSecret resource
manages this Secret instead. This template is skipped to avoid
conflicts between Helm-managed and ESO-managed secrets.
=================================================================
*/}}
{{- if not .Values.externalSecrets.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nexus-qa.secretName" . }}
  labels:
    {{- include "nexus-qa.labels" . | nindent 4 }}
type: Opaque
data:
  jwt-secret: {{ .Values.secrets.jwtSecret | b64enc | quote }}
  postgres-password: {{ .Values.secrets.postgresPassword | b64enc | quote }}
  redis-password: {{ .Values.secrets.redisPassword | default "" | b64enc | quote }}
  neo4j-password: {{ .Values.secrets.neo4jPassword | b64enc | quote }}
  minio-access-key: {{ .Values.secrets.minioAccessKey | b64enc | quote }}
  minio-secret-key: {{ .Values.secrets.minioSecretKey | b64enc | quote }}
  grafana-password: {{ .Values.secrets.grafanaPassword | b64enc | quote }}
  HEART_TIER1_API_KEY: {{ .Values.secrets.heartTier1ApiKey | default "" | b64enc | quote }}
  HEART_TIER2_API_KEY: {{ .Values.secrets.heartTier2ApiKey | default "" | b64enc | quote }}
  BRAIN_TIER1_API_KEY: {{ .Values.secrets.brainTier1ApiKey | default "" | b64enc | quote }}
  BRAIN_TIER2_API_KEY: {{ .Values.secrets.brainTier2ApiKey | default "" | b64enc | quote }}
  EYES_VISION_TIER1_API_KEY: {{ .Values.secrets.eyesVisionTier1ApiKey | default "" | b64enc | quote }}
  EYES_VISION_TIER2_API_KEY: {{ .Values.secrets.eyesVisionTier2ApiKey | default "" | b64enc | quote }}
  {{- if .Values.secrets.shieldEncryptionKey }}
  shield-encryption-key: {{ .Values.secrets.shieldEncryptionKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.earsHfToken }}
  ears-hf-token: {{ .Values.secrets.earsHfToken | b64enc | quote }}
  {{- end }}
  {{- /* Cloud object-storage credentials — only emit ones the backend needs */}}
  {{- if eq (default "s3" .Values.storage.backend) "s3" }}
  s3-access-key: {{ .Values.secrets.s3AccessKey | default .Values.secrets.minioAccessKey | b64enc | quote }}
  s3-secret-key: {{ .Values.secrets.s3SecretKey | default .Values.secrets.minioSecretKey | b64enc | quote }}
  {{- end }}
  {{- if eq (default "s3" .Values.storage.backend) "azure" }}
  {{- if .Values.secrets.azureStorageKey }}
  azure-storage-key: {{ .Values.secrets.azureStorageKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.azureStorageConnString }}
  azure-storage-connection-string: {{ .Values.secrets.azureStorageConnString | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- if eq (default "s3" .Values.storage.backend) "gcs" }}
  {{- if .Values.secrets.gcsServiceAccountJson }}
  gcs-service-account.json: {{ .Values.secrets.gcsServiceAccountJson | b64enc | quote }}
  {{- end }}
  {{- end }}
{{- end }}
