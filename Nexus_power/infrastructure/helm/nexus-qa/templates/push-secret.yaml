{{/*
=================================================================
PushSecret — one-shot bootstrap from Helm values → remote backend.

When .Values.externalSecrets.bootstrap.enabled is true, this template
creates a PushSecret CR that publishes the values in .Values.secrets
to the configured ClusterSecretStore. This is the ONLY supported way
to populate a fresh environment from in-cluster (avoids out-of-band
`aws secretsmanager put-secret-value` for every key).

Lifecycle:
  - Enable bootstrap once, after the SecretStore is Ready.
  - PushSecret runs on every reconcile, but the deletionPolicy: Retain
    + updatePolicy: IfNotExists makes it a no-op after the first push.
  - Disable bootstrap (set enabled: false) and remove the values from
    .Values.secrets.* in the next PR. ESO will continue pulling.

Never enable bootstrap in production: production secrets are seeded
out-of-band by release engineering (terraform / KMS console), not from
a Helm release.
=================================================================
*/}}

{{- if and .Values.externalSecrets.enabled .Values.externalSecrets.bootstrap.enabled }}
{{- $fullname := include "nexus-qa.fullname" . }}
{{- $prefix := default "nexus-qa" .Values.externalSecrets.remoteKeyPrefix }}

# Safety: production must never run the bootstrap path.
{{- if eq .Values.config.nexusEnv "production" }}
{{- fail "externalSecrets.bootstrap.enabled MUST be false in production" }}
{{- end }}

---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: {{ $fullname }}-bootstrap
  labels:
    {{- include "nexus-qa.labels" . | nindent 4 }}
  annotations:
    nexus-qa.io/bootstrap-only: "true"
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - name: {{ required "externalSecrets.secretStoreRef.name is required" .Values.externalSecrets.secretStoreRef.name }}
      kind: {{ default "ClusterSecretStore" .Values.externalSecrets.secretStoreRef.kind }}
  selector:
    secret:
      name: {{ include "nexus-qa.secretName" . }}-bootstrap
  data:
    {{- range $key := list
        "jwt-secret"
        "postgres-password"
        "redis-password"
        "neo4j-password"
        "minio-access-key"
        "minio-secret-key"
        "grafana-password" }}
    - match:
        secretKey: {{ $key }}
        remoteRef:
          remoteKey: {{ $prefix }}/{{ $key }}
    {{- end }}
  updatePolicy: IfNotExists
  deletionPolicy: Retain

---
# The bootstrap-only Secret that PushSecret reads from. Static values
# come from .Values.secrets.*; in production this Secret is NOT created
# because the fail() above aborts the template render.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nexus-qa.secretName" . }}-bootstrap
  labels:
    {{- include "nexus-qa.labels" . | nindent 4 }}
    nexus-qa.io/bootstrap-only: "true"
type: Opaque
data:
  jwt-secret: {{ required ".Values.secrets.jwtSecret is required during bootstrap" .Values.secrets.jwtSecret | b64enc | quote }}
  postgres-password: {{ required ".Values.secrets.postgresPassword is required during bootstrap" .Values.secrets.postgresPassword | b64enc | quote }}
  redis-password: {{ .Values.secrets.redisPassword | default "" | b64enc | quote }}
  neo4j-password: {{ required ".Values.secrets.neo4jPassword is required during bootstrap" .Values.secrets.neo4jPassword | b64enc | quote }}
  minio-access-key: {{ required ".Values.secrets.minioAccessKey is required during bootstrap" .Values.secrets.minioAccessKey | b64enc | quote }}
  minio-secret-key: {{ required ".Values.secrets.minioSecretKey is required during bootstrap" .Values.secrets.minioSecretKey | b64enc | quote }}
  grafana-password: {{ required ".Values.secrets.grafanaPassword is required during bootstrap" .Values.secrets.grafanaPassword | b64enc | quote }}

{{- end }}
