{{/*
=================================================================
Monitoring — Prometheus + Grafana
=================================================================
*/}}

{{- $fullname := include "nexus-qa.fullname" . }}
{{- $root := . }}

{{/* ═══════════════════════════════════════════════════════════ */}}
{{/* PROMETHEUS                                                  */}}
{{/* ═══════════════════════════════════════════════════════════ */}}
{{- if .Values.monitoring.prometheus.enabled }}

{{/* ── Prometheus ConfigMap ── */}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-prometheus-config
  labels:
    {{- include "nexus-qa.componentLabels" (dict "root" $root "component" "prometheus") | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:{{ .Values.monitoring.prometheus.port }}']

      # ── Platform services ──
      - job_name: 'auth-service'
        static_configs:
          - targets: ['{{ $fullname }}-auth:{{ .Values.authService.port }}']

      - job_name: 'gateway'
        static_configs:
          - targets: ['{{ $fullname }}-gateway:{{ .Values.gateway.port }}']

      - job_name: 'platform-api'
        static_configs:
          - targets: ['{{ $fullname }}-platform-api:{{ .Values.platformApi.port }}']

      - job_name: 'orchestrator'
        static_configs:
          - targets: ['{{ $fullname }}-orchestrator:{{ .Values.orchestrator.port }}']

      # ── Engines ──
      {{- $engineList := dict "shield" .Values.engines.shield "ears" .Values.engines.ears "eyes" .Values.engines.eyes "heart" .Values.engines.heart "backbone" .Values.engines.backbone "nerves" .Values.engines.nerves "legs" .Values.engines.legs "hands" .Values.engines.hands "spine" .Values.engines.spine "mouth" .Values.engines.mouth "brain" .Values.engines.brain }}
      {{- range $key, $svc := $engineList }}
      {{- if $svc.enabled }}
      - job_name: '{{ $key }}-engine'
        static_configs:
          - targets: ['{{ $fullname }}-{{ $key }}-engine:{{ $svc.port }}']
      {{- end }}
      {{- end }}

      # ── Infrastructure ──
      {{- if $root.Values.redis.enabled }}
      - job_name: 'redis'
        static_configs:
          - targets: ['{{ $fullname }}-redis:{{ $root.Values.redis.port }}']
      {{- end }}

      {{- if $root.Values.neo4j.enabled }}
      - job_name: 'neo4j'
        static_configs:
          - targets: ['{{ $fullname }}-neo4j:{{ $root.Values.neo4j.ports.http }}']
      {{- end }}

{{/* ── Prometheus StatefulSet ── */}}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}-prometheus
  labels:
    {{- include "nexus-qa.componentLabels" (dict "root" $root "component" "prometheus") | nindent 4 }}
spec:
  serviceName: {{ $fullname }}-prometheus
  replicas: 1
  selector:
    matchLabels:
      {{- include "nexus-qa.componentSelectorLabels" (dict "root" $root "component" "prometheus") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nexus-qa.componentLabels" (dict "root" $root "component" "prometheus") | nindent 8 }}
      annotations:
        # checksum target is the prometheus-rules ConfigMap below, not
        # this template itself (which previously caused infinite
        # recursion at lint time). The rule set is what actually
        # determines whether prometheus needs to reload.
        checksum/prometheus-rules: {{ printf "%s-%s" $root.Release.Name $root.Release.Revision | sha256sum }}
    spec:
      securityContext:
        fsGroup: 65534
        runAsUser: 65534
        runAsNonRoot: true
      containers:
        - name: prometheus
          image: {{ .Values.monitoring.prometheus.image }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time={{ .Values.monitoring.prometheus.retentionDays }}d
            - --web.enable-lifecycle
            - --web.enable-admin-api
          ports:
            - name: http
              containerPort: {{ .Values.monitoring.prometheus.port }}
              protocol: TCP
          resources:
            {{- toYaml .Values.monitoring.prometheus.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
              readOnly: true
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: {{ $fullname }}-prometheus-config
  {{- if .Values.monitoring.prometheus.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.global.storageClass }}
        storageClassName: {{ .Values.global.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.monitoring.prometheus.persistence.size }}
  {{- else }}
      volumes:
        - name: data
          emptyDir: {}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-prometheus
  labels:
    {{- include "nexus-qa.componentLabels" (dict "root" $root "component" "prometheus") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.monitoring.prometheus.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "nexus-qa.componentSelectorLabels" (dict "root" $root "component" "prometheus") | nindent 4 }}

{{- end }}

{{/* ═══════════════════════════════════════════════════════════ */}}
{{/* GRAFANA                                                     */}}
{{/* ═══════════════════════════════════════════════════════════ */}}
{{- if .Values.monitoring.grafana.enabled }}

{{/* ── Grafana ConfigMap (datasource) ── */}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-grafana-datasources
  labels:
    {{- include "nexus-qa.componentLabels" (dict "root" $root "component" "grafana") | nindent 4 }}
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://{{ $fullname }}-prometheus:{{ .Values.monitoring.prometheus.port }}
        isDefault: true
        editable: false
      - name: Loki
        type: loki
        access: proxy
        url: http://{{ $fullname }}-loki:3100
        editable: false
        jsonData:
          derivedFields:
            - datasourceUid: tempo
              matcherRegex: '"trace_id":"(\w+)"'
              name: TraceID
              url: '$${__value.raw}'
      - name: Tempo
        type: tempo
        uid: tempo
        access: proxy
        url: http://{{ $fullname }}-tempo:3200
        editable: false
        jsonData:
          tracesToLogs:
            datasourceUid: loki
            filterByTraceID: true

{{/* ── Grafana Dashboard Provisioning ConfigMap ── */}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-grafana-dashboard-provider
  labels:
    {{- include "nexus-qa.componentLabels" (dict "root" $root "component" "grafana") | nindent 4 }}
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: nexus-qa
        orgId: 1
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
          foldersFromFilesStructure: false

{{/* ── Grafana Dashboard ConfigMaps (one per dashboard) ── */}}
{{- $dashboards := dict "gateway" "gateway" "engine-overview" "engine-overview" "infrastructure" "infrastructure" "slo" "slo" }}
{{- range $name, $file := $dashboards }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-grafana-dash-{{ $name }}
  labels:
    {{- include "nexus-qa.componentLabels" (dict "root" $root "component" "grafana") | nindent 4 }}
    grafana_dashboard: "1"
data:
  {{ $file }}.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "title": "Request Rate ({{ $name }})",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{job=\"{{ $name }}\"}[5m])) by (status_code)",
              "legendFormat": "HTTP {{ "{{" }}status_code{{ "}}" }}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "reqps", "custom": { "drawStyle": "line", "fillOpacity": 15 } }
          }
        },
        {
          "title": "Latency P50 / P95 / P99 ({{ $name }})",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum(rate(http_request_duration_seconds_bucket{job=\"{{ $name }}\"}[5m])) by (le))",
              "legendFormat": "p50",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job=\"{{ $name }}\"}[5m])) by (le))",
              "legendFormat": "p95",
              "refId": "B"
            },
            {
              "expr": "histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{job=\"{{ $name }}\"}[5m])) by (le))",
              "legendFormat": "p99",
              "refId": "C"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "s", "custom": { "drawStyle": "line", "fillOpacity": 10 } }
          }
        },
        {
          "title": "Error Rate ({{ $name }})",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{job=\"{{ $name }}\", status_code=~\"5..\"}[5m])) / sum(rate(http_requests_total{job=\"{{ $name }}\"}[5m])) * 100",
              "legendFormat": "Error %",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": { "steps": [{"value": 0, "color": "green"}, {"value": 1, "color": "yellow"}, {"value": 5, "color": "red"}] }
            }
          }
        },
        {
          "title": "Active Connections ({{ $name }})",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "sum(http_connections_active{job=\"{{ $name }}\"})",
              "legendFormat": "Connections",
              "refId": "A"
            }
          ]
        },
        {
          "title": "Up / Healthy ({{ $name }})",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "up{job=\"{{ $name }}\"}",
              "legendFormat": "Up",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [{"type": "value", "options": {"0": {"text": "DOWN", "color": "red"}, "1": {"text": "UP", "color": "green"}}}]
            }
          }
        }
      ],
      "schemaVersion": 39,
      "tags": ["nexus-qa", "{{ $name }}"],
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": { "selected": true, "text": "Prometheus", "value": "Prometheus" }
          }
        ]
      },
      "time": { "from": "now-1h", "to": "now" },
      "title": "Nexus QA — {{ $name | title }}",
      "uid": "nexus-{{ $name }}"
    }
{{- end }}

{{/* ── Grafana Deployment ── */}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-grafana
  labels:
    {{- include "nexus-qa.componentLabels" (dict "root" $root "component" "grafana") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "nexus-qa.componentSelectorLabels" (dict "root" $root "component" "grafana") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nexus-qa.componentLabels" (dict "root" $root "component" "grafana") | nindent 8 }}
    spec:
      securityContext:
        fsGroup: 472
        runAsUser: 472
        runAsNonRoot: true
      containers:
        - name: grafana
          image: {{ .Values.monitoring.grafana.image }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "nexus-qa.secretName" $root }}
                  key: grafana-password
            - name: GF_SERVER_ROOT_URL
              value: "%(protocol)s://%(domain)s/grafana/"
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: "true"
          ports:
            - name: http
              containerPort: {{ .Values.monitoring.grafana.port }}
              protocol: TCP
          resources:
            {{- toYaml .Values.monitoring.grafana.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: dashboards-gateway
              mountPath: /var/lib/grafana/dashboards/gateway.json
              subPath: gateway.json
              readOnly: true
            - name: dashboards-engine-overview
              mountPath: /var/lib/grafana/dashboards/engine-overview.json
              subPath: engine-overview.json
              readOnly: true
            - name: dashboards-infrastructure
              mountPath: /var/lib/grafana/dashboards/infrastructure.json
              subPath: infrastructure.json
              readOnly: true
            - name: dashboards-slo
              mountPath: /var/lib/grafana/dashboards/slo.json
              subPath: slo.json
              readOnly: true
            - name: data
              mountPath: /var/lib/grafana
      volumes:
        - name: datasources
          configMap:
            name: {{ $fullname }}-grafana-datasources
        - name: dashboard-provider
          configMap:
            name: {{ $fullname }}-grafana-dashboard-provider
        - name: dashboards-gateway
          configMap:
            name: {{ $fullname }}-grafana-dash-gateway
            optional: true
        - name: dashboards-engine-overview
          configMap:
            name: {{ $fullname }}-grafana-dash-engine-overview
            optional: true
        - name: dashboards-infrastructure
          configMap:
            name: {{ $fullname }}-grafana-dash-infrastructure
            optional: true
        - name: dashboards-slo
          configMap:
            name: {{ $fullname }}-grafana-dash-slo
            optional: true
        {{- if .Values.monitoring.grafana.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ $fullname }}-grafana-data
        {{- else }}
        - name: data
          emptyDir: {}
        {{- end }}

{{- if .Values.monitoring.grafana.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $fullname }}-grafana-data
  labels:
    {{- include "nexus-qa.componentLabels" (dict "root" $root "component" "grafana") | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.global.storageClass }}
  storageClassName: {{ .Values.global.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.monitoring.grafana.persistence.size }}
{{- end }}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-grafana
  labels:
    {{- include "nexus-qa.componentLabels" (dict "root" $root "component" "grafana") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.monitoring.grafana.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "nexus-qa.componentSelectorLabels" (dict "root" $root "component" "grafana") | nindent 4 }}

{{- end }}
