{{/*
=================================================================
External Secret — syncs cluster credentials from the bound KMS
backend (AWS Secrets Manager / GCP Secret Manager / Azure Key
Vault / HashiCorp Vault) into the platform's Kubernetes Secret.

When .Values.externalSecrets.enabled is true:
  - secret.yaml is skipped (see secret.yaml top-of-file guard)
  - this template owns the target Secret
  - the target name MUST match what the rest of the chart references
    via include "nexus-qa.secretName"

Remote-key contract:
  Every key MUST exist in the upstream backend at
    <remoteKeyPrefix>/<key>
  Missing keys cause the ExternalSecret to enter SyncFailed state.
  The PrometheusRule in resources/external-secrets/common/ alerts on
  this within 10 minutes.
=================================================================
*/}}

{{- if .Values.externalSecrets.enabled }}
{{- $fullname := include "nexus-qa.fullname" . }}
{{- $prefix := default "nexus-qa" .Values.externalSecrets.remoteKeyPrefix }}
{{- $property := .Values.externalSecrets.property }}
{{- $storeKind := default "ClusterSecretStore" .Values.externalSecrets.secretStoreRef.kind }}
{{- $backend := default "s3" .Values.storage.backend }}

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $fullname }}-secrets
  labels:
    {{- include "nexus-qa.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ default "1h" .Values.externalSecrets.refreshInterval }}

  secretStoreRef:
    name: {{ required "externalSecrets.secretStoreRef.name is required when externalSecrets.enabled is true" .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ $storeKind }}

  target:
    name: {{ include "nexus-qa.secretName" . }}
    # Owner: ESO creates and fully manages the Secret. If a static secret
    # already exists with the same name, ESO will replace it on first
    # sync (Helm hook order ensures secret.yaml is skipped when
    # externalSecrets.enabled is true, so there is no collision).
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      mergePolicy: Replace
      engineVersion: v2

  data:
    # ── Core platform credentials ───────────────────────────────
    {{- range $key := list
        "jwt-secret"
        "postgres-password"
        "redis-password"
        "neo4j-password"
        "minio-access-key"
        "minio-secret-key"
        "grafana-password" }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ $prefix }}/{{ $key }}
        {{- if $property }}
        property: {{ $property }}
        {{- end }}
    {{- end }}

    # ── Optional engine credentials ─────────────────────────────
    {{- if .Values.externalSecrets.includeShieldKey }}
    - secretKey: shield-encryption-key
      remoteRef:
        key: {{ $prefix }}/shield-encryption-key
        {{- if $property }}
        property: {{ $property }}
        {{- end }}
    {{- end }}

    {{- if .Values.externalSecrets.includeEarsToken }}
    - secretKey: ears-hf-token
      remoteRef:
        key: {{ $prefix }}/ears-hf-token
        {{- if $property }}
        property: {{ $property }}
        {{- end }}
    {{- end }}

    {{- if .Values.externalSecrets.includeLlmTierKeys }}
    {{- range $key := list
        "HEART_TIER1_API_KEY"
        "HEART_TIER2_API_KEY"
        "BRAIN_TIER1_API_KEY"
        "BRAIN_TIER2_API_KEY" }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ $prefix }}/{{ $key | lower | replace "_" "-" }}
        {{- if $property }}
        property: {{ $property }}
        {{- end }}
    {{- end }}
    {{- end }}

    # ── Cloud object-storage credentials (matches storage.backend) ──
    {{- if eq $backend "s3" }}
    - secretKey: s3-access-key
      remoteRef:
        key: {{ $prefix }}/s3-access-key
        {{- if $property }}
        property: {{ $property }}
        {{- end }}
    - secretKey: s3-secret-key
      remoteRef:
        key: {{ $prefix }}/s3-secret-key
        {{- if $property }}
        property: {{ $property }}
        {{- end }}
    {{- else if eq $backend "azure" }}
    {{- if .Values.externalSecrets.azure.useConnectionString }}
    - secretKey: azure-storage-connection-string
      remoteRef:
        key: {{ $prefix }}/azure-storage-connection-string
        {{- if $property }}
        property: {{ $property }}
        {{- end }}
    {{- else if not (default false (default dict .Values.storage.azure).useDefaultCredential) }}
    - secretKey: azure-storage-key
      remoteRef:
        key: {{ $prefix }}/azure-storage-key
        {{- if $property }}
        property: {{ $property }}
        {{- end }}
    {{- end }}
    {{- else if eq $backend "gcs" }}
    {{- if not (default true (default dict .Values.storage.gcs).workloadIdentity) }}
    - secretKey: gcs-service-account.json
      remoteRef:
        key: {{ $prefix }}/gcs-service-account-json
        {{- if $property }}
        property: {{ $property }}
        {{- end }}
    {{- end }}
    {{- end }}

{{- end }}
