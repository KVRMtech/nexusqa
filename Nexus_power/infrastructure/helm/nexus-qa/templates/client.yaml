{{/*
=================================================================
Client (React SPA) Deployment + Service + nginx ConfigMap
=================================================================
*/}}

{{- if .Values.client.enabled }}

{{- $fullname := include "nexus-qa.fullname" . }}
{{- $root := . }}

{{/* ═══════ nginx config ═══════ */}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-client-nginx
  labels:
    {{- include "nexus-qa.componentLabels" (dict "root" $root "component" "client") | nindent 4 }}
data:
  default.conf: |
    server {
        listen       80;
        server_name  _;

        root   /usr/share/nginx/html;
        index  index.html;

        # gzip compression
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_min_length 256;
        gzip_types
            text/plain text/css application/json application/javascript
            text/xml application/xml application/xml+rss text/javascript
            application/vnd.ms-fontobject application/x-font-ttf
            font/opentype image/svg+xml image/x-icon;

        # Cache static assets aggressively
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # API proxy — route to gateway service
        location /api/ {
            proxy_pass http://{{ $fullname }}-gateway:{{ $root.Values.gateway.port }}/;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_buffering off;
            client_max_body_size 500m;
        }

        # SPA fallback — all other routes to index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

{{/* ═══════ Deployment ═══════ */}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-client
  labels:
    {{- include "nexus-qa.componentLabels" (dict "root" $root "component" "client") | nindent 4 }}
spec:
  replicas: {{ .Values.client.replicas }}
  selector:
    matchLabels:
      {{- include "nexus-qa.componentSelectorLabels" (dict "root" $root "component" "client") | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "nexus-qa.componentLabels" (dict "root" $root "component" "client") | nindent 8 }}
      annotations:
        # Was: self-include of this template — infinite recursion at lint.
        # The client's nginx config is bundled into the image; release
        # revision changes are the right trigger for a pod restart.
        checksum/nginx-config: {{ printf "%s-%s" $.Release.Name (toString $.Release.Revision) | sha256sum }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: client
          image: {{ include "nexus-qa.image" (dict "root" $root "service" "client" "tag" "") }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.client.port }}
              protocol: TCP
          resources:
            {{- toYaml .Values.client.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
      volumes:
        - name: nginx-config
          configMap:
            name: {{ $fullname }}-client-nginx
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}

{{/* ═══════ Service ═══════ */}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-client
  labels:
    {{- include "nexus-qa.componentLabels" (dict "root" $root "component" "client") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.client.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "nexus-qa.componentSelectorLabels" (dict "root" $root "component" "client") | nindent 4 }}

{{- end }}
