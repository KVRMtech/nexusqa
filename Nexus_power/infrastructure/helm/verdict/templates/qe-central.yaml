{{/*
=================================================================
qe-central — the Verdict control plane + substrate writer.

Serves /health, /metrics, /api/v1/qec/*, /webhooks/* on :8093. Talks to
BOTH databases (the chart-managed/external qecentral DB as role `qec`, and
the factory `nexus` DB as the least-privilege `qec_substrate` role) and to
the VKPower factory over HTTP. The two DSNs are composed here with the
password injected from the Secret via k8s $(VAR) expansion — the earlier
password env entries MUST precede the DSN entries in this list.

Fail-closed: in a deployed env (env.nexusEnv in {staging,production}) the
boot gate refuses to start on a dev/empty JWT secret, explorer token, DB
password, or the `local` KEK — so a missing Secret is a loud CrashLoop, not
a silent weak deploy.
=================================================================
*/}}
{{- include "verdict.validateScaling" . }}
{{- $fullname := include "verdict.fullname" . }}
{{- $root := . }}
{{- $pgEndpoint := include "verdict.pgEndpoint" . }}
{{- $kekDir := dir .Values.kek.localKekPath }}
{{- $kekFile := base .Values.kek.localKekPath }}
{{- if eq .Values.kek.persistence.mode "pvc" }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $fullname }}-kek
  labels:
    {{- include "verdict.componentLabels" (dict "root" $root "component" "qe-central") | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.global.storageClass }}
  storageClassName: {{ .Values.global.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.kek.persistence.size }}
{{- end }}
{{- if eq .Values.qeCentral.persistence.crawl.mode "pvc" }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $fullname }}-crawl
  labels:
    {{- include "verdict.componentLabels" (dict "root" $root "component" "qe-central") | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.global.storageClass }}
  storageClassName: {{ .Values.global.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.qeCentral.persistence.crawl.size }}
{{- end }}
{{- if eq .Values.qeCentral.persistence.frames.mode "pvc" }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $fullname }}-frames
  labels:
    {{- include "verdict.componentLabels" (dict "root" $root "component" "qe-central") | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.global.storageClass }}
  storageClassName: {{ .Values.global.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.qeCentral.persistence.frames.size }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-qe-central
  labels:
    {{- include "verdict.componentLabels" (dict "root" $root "component" "qe-central") | nindent 4 }}
spec:
  {{- if not .Values.qeCentral.autoscaling.enabled }}
  replicas: {{ .Values.qeCentral.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "verdict.componentSelectorLabels" (dict "root" $root "component" "qe-central") | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "verdict.componentLabels" (dict "root" $root "component" "qe-central") | nindent 8 }}
      annotations:
        {{- include "verdict.podAnnotations" $root | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name | default (include "verdict.fullname" .) }}
      {{- include "verdict.podSpecCommon" $root | nindent 6 }}
      securityContext:
        {{- include "verdict.podSecurityContext" . | nindent 8 }}
      containers:
        - name: qe-central
          image: {{ include "verdict.image" (dict "root" $root "name" .Values.qeCentral.image.name "tag" .Values.qeCentral.image.tag) }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.qeCentral.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "verdict.configName" $root }}
          env:
            - name: PORT
              value: {{ .Values.qeCentral.port | quote }}
            - name: QEC_SERVICE_NAME
              value: "qe-central"
            # ── Secrets (MUST precede the DSN entries that reference them) ──
            - name: NEXUS_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "verdict.secretName" $root }}
                  key: jwt-secret
            - name: QEC_EXPLORER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "verdict.secretName" $root }}
                  key: explorer-token
            - name: QEC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "verdict.secretName" $root }}
                  key: qec-db-password
            - name: QEC_SUBSTRATE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "verdict.secretName" $root }}
                  key: substrate-db-password
            # ── The two DSNs (password via $(VAR); no secret in the ConfigMap) ──
            - name: QEC_DATABASE_URL
              value: "postgresql+asyncpg://{{ .Values.postgres.user }}:$(QEC_DB_PASSWORD)@{{ $pgEndpoint }}/{{ .Values.postgres.database }}"
            - name: NEXUS_DATABASE_URL_SUBSTRATE
              value: "postgresql+asyncpg://{{ .Values.factory.substrate.user }}:$(QEC_SUBSTRATE_DB_PASSWORD)@{{ .Values.factory.substrate.host }}:{{ .Values.factory.substrate.port }}/{{ .Values.factory.substrate.database }}"
            {{- include "verdict.kekEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.qeCentral.resources | nindent 12 }}
          securityContext:
            {{- include "verdict.containerSecurityContext" . | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          volumeMounts:
            - name: kek
              mountPath: {{ $kekDir | quote }}
            - name: crawl
              mountPath: /work
            - name: frames
              mountPath: {{ .Values.env.frameStoragePath | quote }}
            - name: egress-allowlist
              mountPath: /qec/egress-allowlist
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: kek
          {{- if eq .Values.kek.persistence.mode "secret" }}
          secret:
            secretName: {{ required "kek.persistence.secret.name is required when kek.persistence.mode=secret" .Values.kek.persistence.secret.name }}
            items:
              - key: {{ .Values.kek.persistence.secret.key }}
                path: {{ $kekFile }}
          {{- else if eq .Values.kek.persistence.mode "pvc" }}
          persistentVolumeClaim:
            claimName: {{ $fullname }}-kek
          {{- else }}
          emptyDir:
            sizeLimit: {{ .Values.kek.persistence.size }}
          {{- end }}
        - name: crawl
          {{- if eq .Values.qeCentral.persistence.crawl.mode "pvc" }}
          persistentVolumeClaim:
            claimName: {{ $fullname }}-crawl
          {{- else }}
          emptyDir:
            sizeLimit: {{ .Values.qeCentral.persistence.crawl.size }}
          {{- end }}
        - name: frames
          {{- if eq .Values.qeCentral.persistence.frames.mode "pvc" }}
          persistentVolumeClaim:
            claimName: {{ $fullname }}-frames
          {{- else }}
          emptyDir:
            sizeLimit: {{ .Values.qeCentral.persistence.frames.size }}
          {{- end }}
        - name: egress-allowlist
          emptyDir:
            sizeLimit: 8Mi
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-qe-central
  labels:
    {{- include "verdict.componentLabels" (dict "root" $root "component" "qe-central") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.qeCentral.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "verdict.componentSelectorLabels" (dict "root" $root "component" "qe-central") | nindent 4 }}
{{- if .Values.qeCentral.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $fullname }}-qe-central
  labels:
    {{- include "verdict.componentLabels" (dict "root" $root "component" "qe-central") | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $fullname }}-qe-central
  minReplicas: {{ .Values.qeCentral.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.qeCentral.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.qeCentral.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
