{{/*
=================================================================
Secret — Verdict credentials.

Skipped when externalSecrets.enabled is true (the ExternalSecret owns
the target Secret instead — no double management).

SAFETY: values default to empty. This template will emit empty keys,
but the qe-central fail-closed boot gate (app.security.boot_validator)
then REFUSES to start in a deployed env (staging/production), so an
unset secret is a loud, immediate install failure — never a silent
weak deploy. Supply real values via --set / a private override /
externalSecrets.
=================================================================
*/}}
{{- if not .Values.externalSecrets.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "verdict.secretName" . }}
  labels:
    {{- include "verdict.labels" . | nindent 4 }}
type: Opaque
data:
  jwt-secret: {{ .Values.secrets.jwtSecret | default "" | b64enc | quote }}
  explorer-token: {{ .Values.secrets.explorerToken | default "" | b64enc | quote }}
  qec-db-password: {{ .Values.secrets.qecDbPassword | default "" | b64enc | quote }}
  substrate-db-password: {{ .Values.secrets.substrateDbPassword | default "" | b64enc | quote }}
  {{- if .Values.postgres.enabled }}
  postgres-password: {{ .Values.secrets.postgresPassword | default "" | b64enc | quote }}
  {{- end }}
{{- end }}
