{{/*
=================================================================
PrometheusRule — SLO recording rules + alerts over the qe-central control-plane
metrics (the qec_* families exported on /metrics; see servicemonitor.yaml). These
turn the raw counters into on-call signal: a stuck pipeline, a failing factory
dependency, tenant-quota pressure. Every expression references a metric the code
actually emits (app/observability/metrics.py) — no invented series.

Enable with monitoring.prometheusRule.enabled=true (requires the Prometheus
Operator CRDs — kube-prometheus-stack).
=================================================================
*/}}
{{- if and .Values.monitoring.prometheusRule .Values.monitoring.prometheusRule.enabled }}
{{- $pr := .Values.monitoring.prometheusRule }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "verdict.fullname" . }}-verdict
  namespace: {{ $pr.namespace | default .Release.Namespace }}
  labels:
    {{- include "verdict.labels" . | nindent 4 }}
    {{- with $pr.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: verdict.slo.rules
      rules:
        # SLO signal: fraction of cycles that reached a CLEAN terminal state (30m).
        - record: verdict:cycle_success_ratio:30m
          expr: >-
            sum(rate(qec_cycles_completed_total{terminal_state=~"done|passed|clean_run_v1"}[30m]))
            /
            clamp_min(sum(rate(qec_cycles_completed_total[30m])), 1e-9)
        # SLO signal: fraction of factory calls returning 5xx (10m).
        - record: verdict:factory_error_ratio:10m
          expr: >-
            sum(rate(qec_factory_calls_total{status=~"5.."}[10m]))
            /
            clamp_min(sum(rate(qec_factory_calls_total[10m])), 1e-9)
    - name: verdict.alerts
      rules:
        - alert: VerdictControlPlaneMetricsAbsent
          expr: absent(qec_cycles_started_total)
          for: 10m
          labels:
            severity: critical
            service: verdict
          annotations:
            summary: "Verdict control-plane metrics absent"
            description: "No qec_cycles_started_total series for 10m — qe-central /metrics is down or the ServiceMonitor is misconfigured."
        - alert: VerdictCyclePipelineStalled
          expr: >-
            sum(rate(qec_cycles_started_total[30m])) > 0
            and
            sum(rate(qec_cycles_completed_total[30m])) == 0
          for: 15m
          labels:
            severity: critical
            service: verdict
          annotations:
            summary: "Verdict cycles start but none complete"
            description: "Cycles are admitted but none reached a terminal state in 30m — the pipeline is stuck."
        - alert: VerdictCycleFailureRateHigh
          expr: >-
            (1 - verdict:cycle_success_ratio:30m) > {{ $pr.cycleFailureRatio | default 0.25 }}
          for: 15m
          labels:
            severity: warning
            service: verdict
          annotations:
            summary: "Verdict cycle failure rate high"
            description: "More than {{ $pr.cycleFailureRatio | default 0.25 }} of cycles ended failed/error over 30m."
        - alert: VerdictFactoryCallErrors
          expr: sum(rate(qec_factory_calls_total{status=~"5.."}[10m])) > 0
          for: 10m
          labels:
            severity: warning
            service: verdict
          annotations:
            summary: "Verdict to factory calls erroring (5xx)"
            description: "qe-central is seeing 5xx from the VKPower factory over 10m."
        - alert: VerdictFactoryCallLatencyHigh
          expr: >-
            histogram_quantile(0.99, sum(rate(qec_factory_call_duration_seconds_bucket[10m])) by (le))
            > {{ $pr.factoryP99Seconds | default 90 }}
          for: 10m
          labels:
            severity: warning
            service: verdict
          annotations:
            summary: "Verdict factory call p99 latency high"
            description: "99th-percentile factory call latency exceeded {{ $pr.factoryP99Seconds | default 90 }}s over 10m."
        - alert: VerdictTenantQuotaDenialsElevated
          expr: sum by (resource) (rate(qec_quota_decisions_total{decision="denied"}[15m])) > {{ $pr.quotaDenyRate | default 0.1 }}
          for: 15m
          labels:
            severity: warning
            service: verdict
          annotations:
            summary: "Verdict tenant quota denials elevated"
            description: "Tenants are hitting quota on {{`{{ $labels.resource }}`}} — capacity pressure or a runaway tenant."
{{- end }}
