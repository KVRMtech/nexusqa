{{/*
=================================================================
ExternalSecret — sync Verdict credentials from the client's KMS/Vault
(AWS Secrets Manager / GCP Secret Manager / Azure Key Vault / HashiCorp
Vault) into the Verdict Kubernetes Secret via the External Secrets
Operator. When enabled, secret.yaml is skipped (its top guard) and this
template owns the target Secret — so NO plaintext credential ever lives
in the Helm release or the values file. This is the recommended posture
for a regulated / air-gapped install.

Remote-key contract: each key MUST exist in the backend at
  <remoteKeyPrefix>/<key>
A missing key drives the ExternalSecret to SyncFailed (surface it on a
PrometheusRule / alert).
=================================================================
*/}}
{{- if .Values.externalSecrets.enabled }}
{{- $fullname := include "verdict.fullname" . }}
{{- $prefix := default "verdict" .Values.externalSecrets.remoteKeyPrefix }}
{{- $property := .Values.externalSecrets.property }}
{{- $storeKind := default "ClusterSecretStore" .Values.externalSecrets.secretStoreRef.kind }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "verdict.secretName" . }}
  labels:
    {{- include "verdict.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ default "1h" .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ required "externalSecrets.secretStoreRef.name is required when externalSecrets.enabled is true" .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ $storeKind }}
  target:
    name: {{ include "verdict.secretName" . }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      mergePolicy: Replace
      engineVersion: v2
  data:
    {{- $keys := list "jwt-secret" "explorer-token" "qec-db-password" "substrate-db-password" }}
    {{- if .Values.postgres.enabled }}
    {{- $keys = append $keys "postgres-password" }}
    {{- end }}
    {{- range $key := $keys }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ $prefix }}/{{ $key }}
        {{- if $property }}
        property: {{ $property }}
        {{- end }}
    {{- end }}
{{- end }}
