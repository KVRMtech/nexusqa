{{/*
=================================================================
qecentral PostgreSQL — dedicated, chart-managed (single instance).

Rendered only when postgres.enabled. When false, connect to an external
managed Postgres via postgres.external.* (the recommended posture for a
regulated client that already runs HA Postgres with PITR backups).

RLS-SAFE ROLE MODEL (matches scripts/qec_db_bootstrap.sql):
  * initdb superuser = postgres.superuser (password: postgres-password),
    which owns nothing app-facing;
  * a first-init hook creates role `qec` as LOGIN NOSUPERUSER NOBYPASSRLS
    and hands it ownership of the qecentral DB — so the FORCE ROW LEVEL
    SECURITY the qecentral migration installs is NEVER bypassed (a
    superuser/owner-bypassing role would defeat tenant isolation).

The qec_substrate role + its least-privilege grants live on the FACTORY
`nexus` DB and are a one-time superuser step OUTSIDE this chart (VKPower
stays untouchable) — see QECentral/docs/ONPREM_INSTALL.md.
=================================================================
*/}}
{{- if .Values.postgres.enabled }}
{{- $fullname := include "verdict.fullname" . }}
{{- $root := . }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-postgres-init
  labels:
    {{- include "verdict.componentLabels" (dict "root" $root "component" "postgres") | nindent 4 }}
data:
  # First-init only (runs when the data dir is empty). The `qec` password is
  # supplied at runtime from the Secret via psql -v (never baked into the
  # ConfigMap); the database name is a non-secret rendered by Helm.
  10-qec-role.sh: |
    #!/bin/sh
    set -e
    psql -v ON_ERROR_STOP=1 -v qec_password="$QEC_DB_PASSWORD" \
      --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<'EOSQL'
    DO $$
    BEGIN
      IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'qec') THEN
        CREATE ROLE qec LOGIN;
      END IF;
    END
    $$;
    ALTER ROLE qec WITH LOGIN PASSWORD :'qec_password'
      NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
    EOSQL
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<EOSQL
    ALTER DATABASE {{ .Values.postgres.database }} OWNER TO qec;
    REVOKE CONNECT ON DATABASE {{ .Values.postgres.database }} FROM PUBLIC;
    GRANT CONNECT, TEMPORARY ON DATABASE {{ .Values.postgres.database }} TO qec;
    GRANT USAGE, CREATE ON SCHEMA public TO qec;
    EOSQL
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}-postgres
  labels:
    {{- include "verdict.componentLabels" (dict "root" $root "component" "postgres") | nindent 4 }}
spec:
  serviceName: {{ $fullname }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "verdict.componentSelectorLabels" (dict "root" $root "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "verdict.componentLabels" (dict "root" $root "component" "postgres") | nindent 8 }}
    spec:
      {{- include "verdict.podSpecCommon" $root | nindent 6 }}
      securityContext:
        {{- toYaml .Values.postgres.securityContext | nindent 8 }}
      containers:
        - name: postgres
          image: {{ .Values.postgres.image | quote }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.superuser | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "verdict.secretName" $root }}
                  key: postgres-password
            # Consumed only by the first-init role hook (10-qec-role.sh).
            - name: QEC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "verdict.secretName" $root }}
                  key: qec-db-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: {{ .Values.postgres.port }}
              protocol: TCP
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.superuser | quote }}, "-d", {{ .Values.postgres.database | quote }}]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.superuser | quote }}, "-d", {{ .Values.postgres.database | quote }}]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: initdb
          configMap:
            name: {{ $fullname }}-postgres-init
            defaultMode: 0555
        {{- if not .Values.postgres.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
  {{- if .Values.postgres.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.global.storageClass }}
        storageClassName: {{ .Values.global.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.persistence.size }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-postgres
  labels:
    {{- include "verdict.componentLabels" (dict "root" $root "component" "postgres") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.postgres.port }}
      targetPort: postgres
      protocol: TCP
      name: postgres
  selector:
    {{- include "verdict.componentSelectorLabels" (dict "root" $root "component" "postgres") | nindent 4 }}
{{- end }}
