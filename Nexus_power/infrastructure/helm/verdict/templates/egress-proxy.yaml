{{/*
=================================================================
egress-proxy (squid) — the SINGLE NAT hop with a HARD PER-CRAWL host fence
(design §1.1). The quarantined explorer's ONLY route outward is this
proxy; squid enforces the destination-HOST allowlist (the explorer's
in-browser guard enforces the METHOD). An EMPTY allowlist DENIES ALL real
egress — fail-closed by construction.

The same persistent volume is mounted read/write by qe-central at
/qec/egress-allowlist and by squid at /etc/squid/allowlist. qe-central writes
one fence per crawl; squid selects it using the browser context's proxy login.
=================================================================
*/}}
{{- if .Values.egressProxy.enabled }}
{{- $fullname := include "verdict.fullname" . }}
{{- $root := . }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-egress-proxy-conf
  labels:
    {{- include "verdict.componentLabels" (dict "root" $root "component" "egress-proxy") | nindent 4 }}
data:
  squid.conf: |
    # VKPower Verdict egress proxy — HARD per-crawl fence, fail-closed.
    # `basic_fake_auth` accepts any password: the authenticated username is the
    # crawl identity, not a security secret. A missing identity gets a 407.
    auth_param basic program /usr/lib/squid/basic_fake_auth
    auth_param basic children 5 startup=1 idle=1
    auth_param basic realm qec-egress-fence
    auth_param basic credentialsttl 1 minute
    auth_param basic casesensitive on
    acl fenced_crawl proxy_auth REQUIRED

    acl SSL_ports port 443
    acl Safe_ports port 80
    acl Safe_ports port 443
    acl CONNECT method CONNECT

    # Refuse unsafe ports and CONNECT to anything but 443 outright.
    http_access deny !Safe_ports
    http_access deny CONNECT !SSL_ports

    # Require an identity, then apply qe-central's generated ACL pair for every
    # live crawl. An empty crawls.conf permits nothing.
    http_access deny !fenced_crawl
    include /etc/squid/allowlist/crawls.conf

    # Fail-closed default — deny everything else (the nexus stack, metadata
    # endpoints, the wider internet).
    http_access deny all

    http_port {{ .Values.egressProxy.port }}

    # No caching — evidence integrity: never serve a stale/poisoned response and
    # keep zero client data at rest in the proxy.
    cache deny all
    maximum_object_size 0 KB

    # Do not leak the proxy's presence, version, or internal client topology.
    via off
    forwarded_for delete
    httpd_suppress_version_string on
    request_header_access X-Forwarded-For deny all

    # Logs to stdio for the egress-proof audit.
    logfile_rotate 0
    access_log stdio:/dev/stdout squid
    cache_log /dev/stderr

    negative_dns_ttl 1 seconds
    pid_filename /tmp/squid.pid
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-egress-proxy
  labels:
    {{- include "verdict.componentLabels" (dict "root" $root "component" "egress-proxy") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "verdict.componentSelectorLabels" (dict "root" $root "component" "egress-proxy") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "verdict.componentSelectorLabels" (dict "root" $root "component" "egress-proxy") | nindent 8 }}
      annotations:
        checksum/config: {{ .Values.egressProxy | toYaml | sha256sum }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name | default (include "verdict.fullname" .) }}
      {{- include "verdict.podSpecCommon" $root | nindent 6 }}
      containers:
        - name: squid
          image: {{ .Values.egressProxy.image | quote }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - >-
              mkdir -p /etc/squid/allowlist/crawls &&
              { [ -f /etc/squid/allowlist/crawls.conf ] ||
                printf '%s\n' '# empty per-crawl fence set — deny all real egress'
                  > /etc/squid/allowlist/crawls.conf; } &&
              { [ -f /etc/squid/allowlist/reload.stamp ] ||
                echo boot > /etc/squid/allowlist/reload.stamp; } &&
              { chown proxy:proxy /dev/stdout /dev/stderr 2>/dev/null || true; } &&
              { S=/etc/squid/allowlist/reload.stamp; L=$(cat "$S" 2>/dev/null); while :; do
                  C=$(cat "$S" 2>/dev/null || echo 0);
                  [ "$C" != "$L" ] && { L=$C;
                    kill -HUP 1 2>/dev/null || squid -k reconfigure 2>/dev/null || true; };
                  sleep 1; done & } &&
              exec squid -N -f /etc/squid/squid.conf -d 1
          ports:
            - name: proxy
              containerPort: {{ .Values.egressProxy.port }}
              protocol: TCP
          resources:
            {{- toYaml .Values.egressProxy.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: squid-conf
              mountPath: /etc/squid/squid.conf
              subPath: squid.conf
              readOnly: true
            - name: allowlist
              mountPath: /etc/squid/allowlist
            - name: run
              mountPath: /var/run
            - name: spool
              mountPath: /var/spool/squid
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: squid-conf
          configMap:
            name: {{ $fullname }}-egress-proxy-conf
        - name: allowlist
          {{- if eq .Values.egressProxy.persistence.mode "pvc" }}
          persistentVolumeClaim:
            claimName: {{ $fullname }}-egress-allowlist
          {{- else }}
          emptyDir:
            sizeLimit: {{ .Values.egressProxy.persistence.size }}
          {{- end }}
        - name: run
          emptyDir:
            sizeLimit: 32Mi
        - name: spool
          emptyDir:
            sizeLimit: 128Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-egress-proxy
  labels:
    {{- include "verdict.componentLabels" (dict "root" $root "component" "egress-proxy") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.egressProxy.port }}
      targetPort: proxy
      protocol: TCP
      name: proxy
  selector:
    {{- include "verdict.componentSelectorLabels" (dict "root" $root "component" "egress-proxy") | nindent 4 }}
{{- end }}
