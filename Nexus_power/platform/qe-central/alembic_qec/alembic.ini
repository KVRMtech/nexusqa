# Alembic configuration for the QE-Central carved-out `qecentral` database (R-7).
# Own migration chain (qec_001…), fully independent of the VKPower nexus chain.
#
# Run (from platform/qe-central, or inside the container at /app/service):
#   QEC_DATABASE_URL=postgresql+asyncpg://qec:...@postgres:5432/qecentral \
#     alembic -c alembic_qec/alembic.ini upgrade head
#
# env.py overrides sqlalchemy.url from QEC_DATABASE_URL — the value below is a
# dev-only placeholder and must never carry real credentials.

[alembic]
script_location = %(here)s
sqlalchemy.url = postgresql+asyncpg://qec:CHANGE_ME@localhost:5432/qecentral

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
