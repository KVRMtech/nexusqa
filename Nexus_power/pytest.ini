[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    ignore::pytest.PytestUnknownMarkWarning
markers =
    realapi: opt-in tests that make real LLM API calls (cost money). Run with -m realapi.
    slow: tests that take >10s. Run with -m slow.
