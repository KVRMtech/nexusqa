[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    ignore::pytest.PytestUnknownMarkWarning
# `realapi` is documented as OPT-IN ("Run with -m realapi") but nothing ever
# deselected it, so a plain `pytest` run executed tests that call live LLM APIs —
# which cost money and fail with no key configured. Deselecting here is what makes
# the documented contract true. Opting in still works: pytest honours the LAST -m
# on the command line, so `pytest -m realapi` overrides this.
addopts = -m "not realapi"
markers =
    realapi: opt-in tests that make real LLM API calls (cost money). Run with -m realapi.
    slow: tests that take >10s. Run with -m slow.
    m24: M2.4 generation proof — compiles a discovered journey and EXECUTES it
        in a real browser against a seeded application. Needs node plus an
        installed @playwright/test; skips with a named reason without one.
