# VKPower Verdict — nginx: serve the SPA and proxy the QE-Central API routes to
# the qe-central service on the shared `nexus` network. Same-origin requests mean
# the portal ships no hard-coded API host and no CORS is needed.

# WebSocket upgrade map for the live headed-run stream (noVNC /live/websockify).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. WITHOUT a resolver + a variablized proxy_pass, nginx
    # resolves each upstream hostname ONCE at startup and caches the IP for the life
    # of the worker. When qe-central is restarted/recreated on its own (routine during
    # crawl + persona work) it comes back on a NEW container IP, and this nginx keeps
    # dialing the dead old IP → every /api call 502s until the portal is also
    # restarted. Deferring resolution to request time (below) makes /api survive an
    # independent qe-central restart. valid=10s bounds how long a resolved IP is cached.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Security headers (parity with the qe-central posture).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Long-cache the fingerprinted assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # QE-Central API + public probes → the service. The upstream host lives in a
    # variable so nginx re-resolves it per request (via the resolver above) instead
    # of caching the boot-time IP; $request_uri preserves the full path + query string
    # (a variablized proxy_pass with no URI would otherwise drop the query string).
    location /api/ {
        set $qec_upstream http://qe-central:8093;
        proxy_pass $qec_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /health {
        set $qec_upstream http://qe-central:8093;
        proxy_pass $qec_upstream/health;
    }
    location /webhooks/ {
        set $qec_upstream http://qe-central:8093;
        proxy_pass $qec_upstream$request_uri;
        proxy_set_header Host $host;
    }

    # LIVE headed-run stream (noVNC) → the runner's websockify (6080). Serves
    # /live/vnc.html (the viewer) AND the /live/websockify WebSocket. WITHOUT this
    # block, /live/vnc.html falls through to the SPA fallback below and renders the
    # portal's own login/landing page — which looks exactly like "a login page keeps
    # showing when I click Run on a live test". X-Frame-Options is SAMEORIGIN here
    # (not the global DENY) so the Playwright tab's <iframe> can embed the stream.
    location /live/ {
        proxy_pass http://nexus-runner:6080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # SPA fallback — every unknown path renders index.html (client routing).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
