# VKPower Verdict — nginx: serve the SPA and proxy the QE-Central API routes to
# the qe-central service on the shared `nexus` network. Same-origin requests mean
# the portal ships no hard-coded API host and no CORS is needed.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (parity with the qe-central posture).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Long-cache the fingerprinted assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # QE-Central API + public probes → the service.
    location /api/ {
        proxy_pass http://qe-central:8093;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /health {
        proxy_pass http://qe-central:8093/health;
    }
    location /webhooks/ {
        proxy_pass http://qe-central:8093;
        proxy_set_header Host $host;
    }

    # SPA fallback — every unknown path renders index.html (client routing).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
