<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="VKPower">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d2f56"/>
      <stop offset="1" stop-color="#071a33"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd966"/>
      <stop offset="1" stop-color="#e6a817"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="none" stroke="#e6a817" stroke-opacity="0.35" stroke-width="4"/>
  <!-- V -->
  <path d="M46 78 L78 78 L103 156 L96 178 Z" fill="#ffffff"/>
  <!-- K stem -->
  <rect x="150" y="78" width="26" height="100" rx="4" fill="#ffffff"/>
  <!-- K arms -->
  <path d="M176 124 L214 78 L236 78 L196 128 L236 178 L214 178 Z" fill="#ffffff" opacity="0.92"/>
  <!-- power bolt bridging V and K -->
