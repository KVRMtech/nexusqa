[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-plugin-sdk"
version = "1.0.0"
description = "SDK for building integration plugins on the Nexus platform."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Nexus Platform" }]
dependencies = [
    "pydantic>=2.5,<3.0",
    "httpx>=0.27,<0.30",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["nexus_plugin_sdk*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
