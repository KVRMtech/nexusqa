[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-sdk"
version = "0.1.0"
description = "Nexus Platform — Shared Engine SDK"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "redis>=5.0.0",
    "httpx>=0.27.0",
    "PyJWT>=2.8.0",
    "structlog>=24.1.0",
    "prometheus-client>=0.20.0",
    "cryptography>=42.0.0",
    "opentelemetry-api>=1.22.0",
    "opentelemetry-sdk>=1.22.0",
    "opentelemetry-instrumentation-fastapi>=0.43b0",
    "openpyxl>=3.1.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "bcrypt>=4.1.0",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]
# Object-storage extras: install only the backends an engine actually needs.
storage-s3 = ["aiobotocore>=2.13.0"]
storage-azure = [
    "azure-storage-blob>=12.19.0",
    "azure-identity>=1.16.0",
]
storage-gcs = ["gcloud-aio-storage>=9.3.0"]
storage-all = [
    "aiobotocore>=2.13.0",
    "azure-storage-blob>=12.19.0",
    "azure-identity>=1.16.0",
    "gcloud-aio-storage>=9.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["nexus_sdk*"]

# Phase 4 — ship the vocabulary YAMLs as package data.  Without this,
# setuptools' default behaviour strips non-Python files and the
# in-container vocab loader silently registers zero vocabularies,
# breaking T-code enrichment and the PII detector.
[tool.setuptools.package-data]
"nexus_sdk.evidence.vocabularies" = ["*.yaml"]

[tool.ruff]
# Ruff resolves the NEAREST config per file, so this section governs the whole
# sdk/ subtree. Without the `extend` below it silently fell back to ruff's
# DEFAULT rule set (E4/E7/E9/F) instead of the repo's baseline — which meant the
# SDK was gated on rules the rest of the repo defers (48 unused imports) while
# NOT being gated on the correctness rules the repo does enforce. Inheriting the
# root baseline keeps one policy for the whole repo.
extend = "../../ruff.toml"
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
