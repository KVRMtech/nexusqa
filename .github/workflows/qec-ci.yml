# ═══════════════════════════════════════════════════════════════════════════
# QE-Central CI (Phase 5.5) — the workflow that makes the DB-gated integration
# tests ACTUALLY EXECUTE.
#
# Phases 0-5 shipped 656 unit tests, but every DB / RLS / factory-round-trip
# test was skipif-gated on a Postgres that CI never provided, so NONE of them
# had ever run.  This workflow stands up a real Postgres + Redis, builds BOTH
# databases at alembic head (VKPower `nexus` substrate + carved-out `qecentral`)
# through the SAME production bootstrap the operator uses, exports the test DSNs,
# and then:
#
#   * runs all THREE unit suites (qe-central, qe-explorer, repo-intel) with the
#     DB gates OPEN, so the substrate/governance/control-plane/RLS DB tests run;
#   * proves tenant isolation BEHAVIOURALLY (test_rls_isolation.py) through the
#     least-privilege roles — the security-critical gap Phase 5.5 closes;
#   * runs the cost budget gate against the real ledger schema;
#   * runs the VKPower pin suite so the no-break guarantee is enforced in CI;
#   * proves backups are recoverable (restore-drill) + the real-Lua admission mutex.
#
# NOTE: the project lives under Nexus_power/ (the git repo root is one level up),
# so every `run:` step executes from there via `defaults.run.working-directory`,
# and the `on.paths` filters + the one step-level working-directory are prefixed
# with Nexus_power/. Any failure fails the build.
# ═══════════════════════════════════════════════════════════════════════════
name: QE-Central CI

on:
  push:
    branches: [main, develop, "feat/**"]
    paths:
      - ".github/workflows/qec-ci.yml"
      - "Nexus_power/platform/qe-central/**"
      - "Nexus_power/engines/qe-explorer/**"
      - "Nexus_power/engines/repo-intel/**"
      - "Nexus_power/scripts/qec_*"
      - "Nexus_power/scripts/verdict_pg_backup.sh"
      - "Nexus_power/sdk/nexus-sdk/**"
      - "Nexus_power/alembic/**"
      - "Nexus_power/platform/api/tests/test_qec_contract_*.py"
  pull_request:
    branches: [main, develop]
    paths:
      - ".github/workflows/qec-ci.yml"
      - "Nexus_power/platform/qe-central/**"
      - "Nexus_power/engines/qe-explorer/**"
      - "Nexus_power/engines/repo-intel/**"
      - "Nexus_power/scripts/qec_*"
      - "Nexus_power/scripts/verdict_pg_backup.sh"
      - "Nexus_power/sdk/nexus-sdk/**"
      - "Nexus_power/alembic/**"
      - "Nexus_power/platform/api/tests/test_qec_contract_*.py"

concurrency:
  group: qec-ci-${{ github.ref }}
  cancel-in-progress: true

# The project root is Nexus_power/ (nested under the git repo root); run every
# step from there so the relative paths inside the steps resolve unchanged.
defaults:
  run:
    working-directory: Nexus_power

jobs:
  qec:
    runs-on: ubuntu-latest

    # ── Backing services (same aliases the deployed stack uses) ────────────
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    # ── Env: DB connection + the three test DSNs the gated suites read ──────
    # Passwords are CI-only, non-secret, and MUST match between the role-create
    # step (QEC_*_ROLE_PASSWORD) and the DSNs below.
    env:
      PYTHON_VERSION: "3.10"
      # postgres service superuser (libpq reads these directly)
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      # least-privilege application-role passwords
      QEC_ROLE_PASSWORD: qec_ci_pw
      QEC_SUBSTRATE_ROLE_PASSWORD: qec_sub_ci_pw
      # ── Test DSNs (async / asyncpg form) ──────────────────────────────────
      # nexus (superuser): substrate round-trip + the create_all-based DB tests
      QEC_TEST_DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/nexus"
      # qecentral (least-priv `qec` role): governance/control-plane + the RLS
      # isolation proof — a superuser here would BYPASS RLS and prove nothing
      QEC_TEST_QEC_DATABASE_URL: "postgresql+asyncpg://qec:qec_ci_pw@localhost:5432/qecentral"
      # nexus (least-priv `qec_substrate` role): the page_visits RLS proof
      QEC_TEST_SUBSTRATE_DATABASE_URL: "postgresql+asyncpg://qec_substrate:qec_sub_ci_pw@localhost:5432/nexus"
      # App-engine defaults point at the real CI DBs (lazy — only used if a test
      # opens a session without repointing).
      QEC_DATABASE_URL: "postgresql+asyncpg://qec:qec_ci_pw@localhost:5432/qecentral"
      NEXUS_DATABASE_URL_SUBSTRATE: "postgresql+asyncpg://qec_substrate:qec_sub_ci_pw@localhost:5432/nexus"
      # Shared HS256 secret + redis (parity with the deployed stack)
      NEXUS_JWT_SECRET: qec-ci-jwt-secret-not-for-prod
      NEXUS_REDIS_URL: redis://localhost:6379
      # Opt the distributed-admission test into its REAL-Lua path against the live
      # redis service (isolated on db 1) — proves the two-replica shared mutex +
      # fail-closed denial that horizontal scaling depends on, instead of skipping.
      QEC_TEST_REDIS_URL: redis://localhost:6379/1
      QEC_LOG_LEVEL: WARNING
      # The DB-gated contract suite drives each test through its own asyncio.run()
      # (a fresh event loop per test). A pooled async connection binds to the
      # first loop, so every later test raised "got Future attached to a
      # different loop" — the sole reason qec-ci never went green end-to-end.
      # NullPool (fresh connection per checkout, current-loop-bound) fixes it;
      # test-only, so production pooling is untouched.
      QEC_TEST_DB_NULLPOOL: "1"

    steps:
      # (a) checkout + Python 3.10 (the QE-Central runtime; qe-explorer's base
      #     image is CPython 3.10)
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: Nexus_power/**/requirements*.txt

      # psql / pg_isready for the deterministic DB bootstrap
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client

      # (d) install EACH component's requirements.  The editable `-e ../../sdk`
      #     lines are CWD-relative, so each install runs from its own directory.
      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # SDK first (every component depends on it)
          pip install -e sdk/nexus-sdk
          # platform-api — needed by the substrate round-trip subprocess AND the
          # VKPower pin suite (both import the real factory / router modules)
          ( cd platform/api      && pip install -r requirements.txt )
          # QE-Central service + the two engines
          ( cd platform/qe-central && pip install -r requirements.txt )
          ( cd engines/qe-explorer && pip install -r requirements.txt )
          # repo-intel: the native tree-sitter grammars are IMPORT-GUARDED and
          # may lack wheels; prefer the full install, fall back to the hard deps
          # so Stage-1 (which imports neither grammar) still runs.
          ( cd engines/repo-intel && pip install -r requirements.txt ) || {
            echo "::warning::repo-intel native grammars unavailable — installing import-guarded fallback deps"
            pip install -e sdk/nexus-sdk 'pyyaml>=6.0,<7.0'
          }
          # test tooling (asyncio_mode=auto lives in the repo pytest.ini)
          pip install pytest pytest-asyncio pytest-cov httpx faker jinja2 asyncpg alembic croniter

      # (b)+(c) build BOTH databases at head via the SAME production bootstrap
      #         SQL (roles + grants + RLS), then the two alembic chains.
      - name: Bootstrap CI databases (nexus substrate + qecentral @ head)
        run: bash scripts/qec_ci_db_setup.sh

      # (e)+(f) QE-Central suite WITH the DB gates open — the substrate contract,
      #         governance, control-plane, synthesis, RLS isolation and
      #         migration tests all EXECUTE here (this is the whole point).
      - name: QE-Central unit + DB suite
        run: python -m pytest platform/qe-central/tests -v --tb=short

      # (e) qe-explorer unit suite (pure crawler logic)
      - name: qe-explorer unit suite
        run: python -m pytest engines/qe-explorer/tests -v --tb=short

      # (e) repo-intel unit suite (pure extractor / pipeline logic)
      - name: repo-intel unit suite
        run: python -m pytest engines/repo-intel/tests -v --tb=short

      # (g) cost budget gate — exercises the real cost_ledger read path against
      #     an empty ledger under a generous budget (must exit 0 = within budget)
      - name: Cost budget gate
        env:
          QEC_BUDGET_TENANT: qec-ci-budget-probe
          QEC_BUDGET_BROWSER_SECONDS: "1000000"
        run: python scripts/qec_budget_gate.py

      # (h) VKPower pin suite — proves the no-break guarantee: the frozen video
      #     path (T1-T4) + the three extension contracts (E1/E2/E3) stay green.
      - name: VKPower no-break pin suite
        working-directory: Nexus_power/platform/api
        run: |
          python -m pytest \
            tests/test_qec_contract_video_frozen.py \
            tests/test_qec_contract_gt_ingest.py \
            tests/test_qec_contract_auth_import.py \
            tests/test_qec_contract_e2_composer.py \
            -v --tb=short

      # (h2) Execution-reliability guard suite (P0-P2, doctrine 2026-07-24):
      #     the golden corpus (generate→compile→audit invariants I1-I6), the
      #     escape→guard registry law, the attribution engine ladder, the
      #     certification quarantine rule, the proven-oracle soft-miss
      #     recording, and every escaped-defect regression (URL-text oracle,
      #     business names, business Expected Results). A verdict flip here
      #     fails OUR build before a deploy can ship it — see
      #     docs/EXECUTION_RELIABILITY_DOCTRINE.md.
      - name: Execution-reliability guard suite
        working-directory: Nexus_power/platform/api
        run: |
          python -m pytest \
            tests/test_golden_corpus_generation.py \
            tests/test_escape_guard_registry.py \
            tests/test_attribution_engine.py \
            tests/test_certification_quarantine.py \
            tests/test_recovery_orchestrator.py \
            tests/test_combination_regen.py \
            tests/test_soft_oracle_recording.py \
            tests/test_failure_attribution.py \
            tests/test_compiler_url_text_oracle.py \
            tests/test_auditor_url_text_oracle.py \
            tests/test_business_case_names.py \
            tests/test_generator_business_expected.py \
            -v --tb=short

      # (i) Phase 6.3a — backups are PROVEN recoverable, not assumed. Runs LAST so
      #     the seeded probe rows can never perturb the suites above. Exercises the
      #     SAME production script the operator runs (scripts/verdict_pg_backup.sh)
      #     in `local` transport against the CI Postgres, after planting one known
      #     row per DB so the drill's no-empty-restore check is a real data-recovery
      #     proof (not a vacuous empty-schema round-trip).
      - name: Seed DR probe rows (evidence + control-plane roots)
        run: bash scripts/qec_ci_dr_seed.sh

      - name: Backup lands + restore-drill passes (recovery PROVEN)
        env:
          PG_TRANSPORT: local          # direct libpq to the CI Postgres (no docker exec)
          PG_USER: postgres            # the CI superuser (createdb + RLS-bypass for the drill)
          LOCAL_BACKUP_DIR: ${{ runner.temp }}/db_backups
        run: |
          set -euo pipefail
          # 1) a backup must LAND (both DBs dumped, size-sane) …
          bash scripts/verdict_pg_backup.sh | tee "$RUNNER_TEMP/backup.log"
          grep -q '^BACKUP_OK' "$RUNNER_TEMP/backup.log"
          # 2) … and a restore must be PROVEN recoverable — alembic head matches AND
          #    no table with rows in the source comes back empty (the seeded rows).
          bash scripts/verdict_pg_backup.sh --restore-drill | tee "$RUNNER_TEMP/drill.log"
          grep -q '^RESTORE_DRILL_PASS' "$RUNNER_TEMP/drill.log"
