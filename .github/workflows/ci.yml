name: ci

# Stage-1 CI for the evidence engine.
# Goal of this workflow: prove the product BUILDS FROM A CLEAN CHECKOUT — the
# existential "a security team can rebuild from git" requirement. The compile
# gate is blocking and green today. The import-smoke is informational until the
# Stage-2 router reconciliation wires these modules into the tracked app.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  compile:
    name: Compile gate (source builds from a clean checkout)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Byte-compile the platform API + gateway
        run: |
          python -m compileall -q Nexus_power/platform/api/app
          python -m compileall -q Nexus_power/platform/gateway/app

      - name: Assert the never-green-wash evidence-engine modules compile
        run: |
          python -m py_compile \
            Nexus_power/platform/api/app/services/test_factory/agentic_heal.py \
            Nexus_power/platform/api/app/services/test_factory/defect_report.py \
            Nexus_power/platform/api/app/services/test_factory/network_oracle.py \
            Nexus_power/platform/api/app/services/test_factory/recording_quality.py \
            Nexus_power/platform/api/app/services/test_factory/confidence.py \
            Nexus_power/platform/api/app/services/test_factory/run_screenshots.py \
            Nexus_power/platform/api/app/services/diff_and_heal/control_ledger.py \
            Nexus_power/platform/api/app/services/script_factory/compiler.py
          echo "evidence-engine modules compile from source"

  reachability:
    name: Reproducibility gate (every shipped module is wired into a running service)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Static (no imports executed): follows each service's real entrypoint and
      # reports shipped .py files reachable from nothing (latent/dead code).
      # Ratchet: the services measured clean today are BLOCKING, so they can never
      # regress; services that still carry a latent-code backlog
      # (ci/reproducibility/DRIFT_BACKLOG.md) are reported and graduate to --gate as
      # they are cleaned. This is a measured set, not a hand-picked allow-list, and
      # the full report (every service) prints in the log regardless.
      - name: Reachability gate (clean services blocking; backlog tracked)
        run: >
          python Nexus_power/ci/reproducibility/reachability_gate.py
          --discover Nexus_power
          --gate 'engines/qe-explorer' --gate 'platform/gateway'

  import-smoke:
    name: Import gate (the wired app imports with real dependencies)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Nexus_power/platform/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install API requirements (incl. editable nexus-sdk)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Generic: import the service's REAL entrypoint so this tests the wired app,
      # not a hand-picked module list. Blocking — a non-blocking import test is the
      # very green-wash this product exists to prevent. If it needs runtime env,
      # provision it here (a real, tracked requirement — not a reason to skip).
      - name: Import the real service entrypoint (proves the wired app imports)
        run: |
          python -c "import importlib, os, sys; sys.path.insert(0, os.getcwd()); importlib.import_module('main'); print('service entrypoint imports OK')"

  # R6 (requirements audit): these suites existed but ran ONLY when a developer
  # invoked them manually — the regression net wasn't wired to any gate. Pure
  # unit/logic suites (no DB, no browser): blocking.
  qe-explorer-tests:
    name: qe-explorer suite (crawler/auth/forms/matcher — pure logic)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Nexus_power/engines/qe-explorer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install explorer requirements + pytest
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio
      - name: Run the full explorer suite (339 tests, no browser needed)
        run: python -m pytest tests/ -q

  qe-central-unit-tests:
    name: qe-central unit suite (guards/refusals/quota/planner — no DB)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Nexus_power/platform/qe-central
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install qe-central requirements + pytest
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio
      - name: Run the unit suite (DB-gated contract tests live in qec-ci)
        run: python -m pytest tests/unit -q
