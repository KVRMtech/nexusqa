# ═══════════════════════════════════════════════════════════════
# Nexus QA — Docker Compose (On-Prem Production Stack)
# ═══════════════════════════════════════════════════════════════
#
# This is the FULL on-prem deployment stack.
# Run: docker-compose -f docker-compose.yml up -d
#
# Architecture:
#   Client → Gateway → [Shield, Ears, Eyes, Heart, Backbone, Nerves, Legs, Hands, Spine, Mouth]
#                   ↕
#            [Redis, Neo4j, Milvus, Postgres]
#                   ↕
#            [Prometheus, Grafana]
# ═══════════════════════════════════════════════════════════════

x-common-env: &common-env
  NEXUS_ENV: production
  REDIS_URL: redis://redis:6379/0
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  NEXUS_JWT_SECRET: ${NEXUS_JWT_SECRET:?Set NEXUS_JWT_SECRET in .env}

x-common-labels: &common-labels
  app: nexus-qa
  managed-by: docker-compose

# ── Volumes ────────────────────────────────────────────────────
volumes:
  redis-data:
  neo4j-data:
  neo4j-logs:
  milvus-data:
  postgres-data:
  prometheus-data:
  grafana-data:
  model-cache:
  audio-storage:
  frame-storage:
  evidence-storage:
  report-storage:
  document-storage:
  loki-data:
  tempo-data:

# ── Networks ───────────────────────────────────────────────────
networks:
  nexus-internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# ── Services ───────────────────────────────────────────────────
services:

  # ─────────────────────────────────────────────────────────────
  # Infrastructure Layer
  # ─────────────────────────────────────────────────────────────

  redis:
    image: redis:7-alpine
    container_name: nexus-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexus-internal
    labels:
      <<: *common-labels

  postgres:
    image: postgres:16-alpine
    container_name: nexus-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: nexusqa
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexus-internal
    labels:
      <<: *common-labels

  neo4j:
    image: neo4j:5-community
    container_name: nexus-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # Browser UI
      - "7687:7687"   # Bolt protocol
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512M
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - nexus-internal
    labels:
      <<: *common-labels

  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: nexus-milvus-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - milvus-data:/etcd
    networks:
      - nexus-internal

  milvus-minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: nexus-milvus-minio
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}
    command: minio server /minio_data
    volumes:
      - milvus-data:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - nexus-internal

  milvus:
    image: milvusdb/milvus:v2.3.3
    container_name: nexus-milvus
    restart: unless-stopped
    ports:
      - "19530:19530"
    depends_on:
      - milvus-etcd
      - milvus-minio
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - nexus-internal
    labels:
      <<: *common-labels

  # ─────────────────────────────────────────────────────────────
  # Platform Layer
  # ─────────────────────────────────────────────────────────────

  auth-service:
    build:
      context: ../../platform/auth-service
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-nexus-base:latest}
    image: ${REGISTRY:-ghcr.io}/${IMAGE_PREFIX:-nexus-qa/nexus}-auth-service:${IMAGE_TAG:-latest}
    container_name: nexus-auth
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      <<: *common-env
      ENGINE_PORT: 8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexus}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nexusqa}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - nexus-internal
    labels:
      <<: *common-labels

  gateway:
    build:
      context: ../../platform/gateway
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-nexus-base:latest}
    image: ${REGISTRY:-ghcr.io}/${IMAGE_PREFIX:-nexus-qa/nexus}-gateway:${IMAGE_TAG:-latest}
    container_name: nexus-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      <<: *common-env
      ENGINE_PORT: 8080
      AUTH_URL: http://auth-service:8000
      SHIELD_URL: http://shield-engine:8001
      EARS_URL: http://ears-engine:8002
      EYES_URL: http://eyes-engine:8003
      HEART_URL: http://heart-engine:8004
      BACKBONE_URL: http://backbone-engine:8005
      NERVES_URL: http://nerves-engine:8006
      LEGS_URL: http://legs-engine:8007
      HANDS_URL: http://hands-engine:8008
      SPINE_URL: http://spine-engine:8009
      MOUTH_URL: http://mouth-engine:8010
      BRAIN_URL: http://brain-engine:8011
      ORCHESTRATOR_URL: http://orchestrator:8100
      PLATFORM_API_URL: http://platform-api:8091
    depends_on:
      - auth-service
    networks:
      - nexus-internal
    labels:
      <<: *common-labels

  # ─────────────────────────────────────────────────────────────
  # Platform API (Cross-cutting backend for UI)
  # ─────────────────────────────────────────────────────────────

  platform-api:
    build:
      context: ../../platform/api
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-nexus-base:latest}
    image: ${REGISTRY:-ghcr.io}/${IMAGE_PREFIX:-nexus-qa/nexus}-platform-api:${IMAGE_TAG:-latest}
    container_name: nexus-platform-api
    restart: unless-stopped
    ports:
      - "8091:8091"
    environment:
      <<: *common-env
      ENGINE_PORT: 8091
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-nexusqa}
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexus}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nexusqa}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      SHIELD_ENGINE_URL: http://shield-engine:8001
      EARS_ENGINE_URL: http://ears-engine:8002
      EYES_ENGINE_URL: http://eyes-engine:8003
      HEART_ENGINE_URL: http://heart-engine:8004
      BACKBONE_ENGINE_URL: http://backbone-engine:8005
      NERVES_ENGINE_URL: http://nerves-engine:8006
      LEGS_ENGINE_URL: http://legs-engine:8007
      HANDS_ENGINE_URL: http://hands-engine:8008
      SPINE_ENGINE_URL: http://spine-engine:8009
      MOUTH_ENGINE_URL: http://mouth-engine:8010
      BRAIN_ENGINE_URL: http://brain-engine:8011
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nexus-internal
    labels:
      <<: *common-labels

  # ─────────────────────────────────────────────────────────────
  # Engine Layer (CPU)
  # ─────────────────────────────────────────────────────────────

  shield-engine:
    build:
      context: ../../engines/shield-engine
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-nexus-base:latest}
    image: ${REGISTRY:-ghcr.io}/${IMAGE_PREFIX:-nexus-qa/nexus}-shield-engine:${IMAGE_TAG:-latest}
    container_name: nexus-shield
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      <<: *common-env
      ENGINE_PORT: 8001
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - nexus-internal
    labels:
      <<: *common-labels

  backbone-engine:
    build:
      context: ../../engines/backbone-engine
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-nexus-base:latest}
    image: ${REGISTRY:-ghcr.io}/${IMAGE_PREFIX:-nexus-qa/nexus}-backbone-engine:${IMAGE_TAG:-latest}
    container_name: nexus-backbone
    restart: unless-stopped
    ports:
      - "8005:8005"
    environment:
      <<: *common-env
      ENGINE_PORT: 8005
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-nexus-backbone}
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      milvus:
        condition: service_healthy
    networks:
      - nexus-internal
    labels:
      <<: *common-labels

  nerves-engine:
    build:
      context: ../../engines/nerves-engine
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-nexus-base:latest}
    image: ${REGISTRY:-ghcr.io}/${IMAGE_PREFIX:-nexus-qa/nexus}-nerves-engine:${IMAGE_TAG:-latest}
    container_name: nexus-nerves
    restart: unless-stopped
    ports:
      - "8006:8006"
    environment:
      <<: *common-env
      ENGINE_PORT: 8006
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - nexus-internal
    labels:
      <<: *common-labels

  legs-engine:
    build:
      context: ../../engines/legs-engine
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-nexus-base:latest}
    image: ${REGISTRY:-ghcr.io}/${IMAGE_PREFIX:-nexus-qa/nexus}-legs-engine:${IMAGE_TAG:-latest}
    container_name: nexus-legs
    restart: unless-stopped
    ports:
      - "8007:8007"
    environment:
      <<: *common-env
      ENGINE_PORT: 8007
    volumes:
      - evidence-storage:/app/data/evidence
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - nexus-internal
    labels:
      <<: *common-labels

  hands-engine:
    build:
      context: ../../engines/hands-engine
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-nexus-base:latest}
    image: ${REGISTRY:-ghcr.io}/${IMAGE_PREFIX:-nexus-qa/nexus}-hands-engine:${IMAGE_TAG:-latest}
    container_name: nexus-hands
    restart: unless-stopped
    ports:
      - "8008:8008"
    environment:
      <<: *common-env
      ENGINE_PORT: 8008
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - nexus-internal
    labels:
      <<: *common-labels

  spine-engine:
    build:
      context: ../../engines/spine-engine
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-nexus-base:latest}
    image: ${REGISTRY:-ghcr.io}/${IMAGE_PREFIX:-nexus-qa/nexus}-spine-engine:${IMAGE_TAG:-latest}
    container_name: nexus-spine
    restart: unless-stopped
    ports:
      - "8009:8009"
    environment:
      <<: *common-env
      ENGINE_PORT: 8009
    volumes:
      - document-storage:/app/data/documents
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - nexus-internal
    labels:
      <<: *common-labels

  mouth-engine:
    build:
      context: ../../engines/mouth-engine
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-nexus-base:latest}
    image: ${REGISTRY:-ghcr.io}/${IMAGE_PREFIX:-nexus-qa/nexus}-mouth-engine:${IMAGE_TAG:-latest}
    container_name: nexus-mouth
    restart: unless-stopped
    ports:
      - "8010:8010"
    environment:
      <<: *common-env
      ENGINE_PORT: 8010
    volumes:
      - report-storage:/app/data/reports
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - nexus-internal
    labels:
      <<: *common-labels

  # ─────────────────────────────────────────────────────────────
  # Brain Engine (Intelligent coordinator)
  # ─────────────────────────────────────────────────────────────

  brain-engine:
    build:
      context: ../../engines/brain-engine
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-nexus-base:latest}
    image: ${REGISTRY:-ghcr.io}/${IMAGE_PREFIX:-nexus-qa/nexus}-brain-engine:${IMAGE_TAG:-latest}
    container_name: nexus-brain
    restart: unless-stopped
    ports:
      - "8011:8011"
    environment:
      <<: *common-env
      ENGINE_PORT: 8011
      # ── Multi-Tier Provider Configuration ──────────────────
      # Tier 1 (Cloud - Best)
      # BRAIN_TIER1_PROVIDER: anthropic
      # BRAIN_TIER1_MODEL: claude-opus-4-5-20250514
      # BRAIN_TIER1_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Tier 2 (Cloud - Fallback)
      # BRAIN_TIER2_PROVIDER: openai
      # BRAIN_TIER2_MODEL: gpt-5
      # BRAIN_TIER2_API_KEY: ${OPENAI_API_KEY:-}
      # Tier 3 (Local On-Prem)
      # BRAIN_TIER3_PROVIDER: ollama
      # BRAIN_TIER3_MODEL: llama3.1:70b
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - nexus-internal
    labels:
      <<: *common-labels

  # ─────────────────────────────────────────────────────────────
  # QA Orchestrator (Chain-based workflow engine)
  # ─────────────────────────────────────────────────────────────

  orchestrator:
    build:
      context: ../../products/nexus-qa-orchestrator
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-nexus-base:latest}
    image: ${REGISTRY:-ghcr.io}/${IMAGE_PREFIX:-nexus-qa/nexus}-orchestrator:${IMAGE_TAG:-latest}
    container_name: nexus-orchestrator
    restart: unless-stopped
    ports:
      - "8100:8100"
    environment:
      <<: *common-env
      ENGINE_PORT: 8100
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      SHIELD_ENGINE_URL: http://shield-engine:8001
      EARS_ENGINE_URL: http://ears-engine:8002
      EYES_ENGINE_URL: http://eyes-engine:8003
      HEART_ENGINE_URL: http://heart-engine:8004
      BACKBONE_ENGINE_URL: http://backbone-engine:8005
      NERVES_ENGINE_URL: http://nerves-engine:8006
      LEGS_ENGINE_URL: http://legs-engine:8007
      HANDS_ENGINE_URL: http://hands-engine:8008
      SPINE_ENGINE_URL: http://spine-engine:8009
      MOUTH_ENGINE_URL: http://mouth-engine:8010
      BRAIN_ENGINE_URL: http://brain-engine:8011
    command: ["python", "-m", "app.main"]
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - nexus-internal
    labels:
      <<: *common-labels

  # ─────────────────────────────────────────────────────────────
  # Engine Layer (GPU — requires NVIDIA Docker runtime)
  # ─────────────────────────────────────────────────────────────

  ears-engine:
    build:
      context: ../../engines/ears-engine
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${GPU_BASE_IMAGE:-nexus-gpu:latest}
    image: ${REGISTRY:-ghcr.io}/${IMAGE_PREFIX:-nexus-qa/nexus}-ears-engine:${IMAGE_TAG:-latest}
    container_name: nexus-ears
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      <<: *common-env
      ENGINE_PORT: 8002
      WHISPER_DEVICE: cuda
      WHISPER_COMPUTE_TYPE: float16
    volumes:
      - model-cache:/app/models
      - audio-storage:/app/data/audio
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - nexus-internal
    labels:
      <<: *common-labels

  eyes-engine:
    build:
      context: ../../engines/eyes-engine
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${GPU_BASE_IMAGE:-nexus-gpu:latest}
    image: ${REGISTRY:-ghcr.io}/${IMAGE_PREFIX:-nexus-qa/nexus}-eyes-engine:${IMAGE_TAG:-latest}
    container_name: nexus-eyes
    restart: unless-stopped
    ports:
      - "8003:8003"
    environment:
      <<: *common-env
      ENGINE_PORT: 8003
      VISION_DEVICE: cuda
    volumes:
      - model-cache:/app/models
      - frame-storage:/app/data/frames
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - nexus-internal
    labels:
      <<: *common-labels

  heart-engine:
    build:
      context: ../../engines/heart-engine
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${GPU_BASE_IMAGE:-nexus-gpu:latest}
    image: ${REGISTRY:-ghcr.io}/${IMAGE_PREFIX:-nexus-qa/nexus}-heart-engine:${IMAGE_TAG:-latest}
    container_name: nexus-heart
    restart: unless-stopped
    ports:
      - "8004:8004"
    environment:
      <<: *common-env
      ENGINE_PORT: 8004
      LLM_DEVICE: cuda
    volumes:
      - model-cache:/app/models
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - nexus-internal
    labels:
      <<: *common-labels

  # ─────────────────────────────────────────────────────────────
  # Observability Layer
  # ─────────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: nexus-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - nexus-internal
    labels:
      <<: *common-labels

  grafana:
    image: grafana/grafana:10.2.0
    container_name: nexus-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-nexus-monitor}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - nexus-internal
    labels:
      <<: *common-labels

  # OpenTelemetry Collector — receives traces from all engines and forwards to Tempo
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.92.0
    container_name: nexus-otel-collector
    restart: unless-stopped
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"   # Prometheus metrics (collector self-monitoring)
    volumes:
      - ../monitoring/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    depends_on:
      - tempo
    networks:
      - nexus-internal
    labels:
      <<: *common-labels

  # Grafana Tempo — distributed tracing backend
  tempo:
    image: grafana/tempo:2.3.1
    container_name: nexus-tempo
    restart: unless-stopped
    ports:
      - "3200:3200"   # Tempo query API
    volumes:
      - ../monitoring/tempo.yaml:/etc/tempo/config.yaml:ro
      - tempo-data:/var/tempo
    command: ["-config.file=/etc/tempo/config.yaml"]
    networks:
      - nexus-internal
    labels:
      <<: *common-labels

  # Grafana Loki — log aggregation
  loki:
    image: grafana/loki:2.9.3
    container_name: nexus-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ../monitoring/loki.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    networks:
      - nexus-internal
    labels:
      <<: *common-labels

  # ─────────────────────────────────────────────────────────────
  # Frontend Client
  # ─────────────────────────────────────────────────────────────

  client:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile.client
      args:
        VITE_API_BASE: /api
        VITE_API_MODE: strict
    image: ${REGISTRY:-ghcr.io}/${IMAGE_PREFIX:-nexus-qa/nexus}-client:${IMAGE_TAG:-latest}
    container_name: nexus-client
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-3080}:80"
    depends_on:
      - gateway
    networks:
      - nexus-internal
    labels:
      <<: *common-labels
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3

  # ─────────────────────────────────────────────────────────────
  # Ollama LLM Service (Heart engine backend)
  # ─────────────────────────────────────────────────────────────

  ollama:
    image: ollama/ollama:latest
    container_name: nexus-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - model-cache:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0
    networks:
      - nexus-internal
    labels:
      <<: *common-labels
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ─────────────────────────────────────────────────────────────
  # Load Testing (Locust — disabled by default, enable via profile)
  # Usage: docker compose -f docker-compose.yml --profile load-test up locust
  # ─────────────────────────────────────────────────────────────

  locust:
    image: locustio/locust:2.29.1
    container_name: nexus-locust
    profiles:
      - load-test
    ports:
      - "${LOCUST_WEB_PORT:-8089}:8089"
    volumes:
      - ../../tests/load:/mnt/locust:ro
      - ../../reports:/mnt/reports
    environment:
      LOCUST_LOCUSTFILE: /mnt/locust/locustfile.py
      LOCUST_HOST: http://gateway:8080
      LOCUST_USERS: ${LOCUST_USERS:-100}
      LOCUST_SPAWN_RATE: ${LOCUST_SPAWN_RATE:-10}
    command: >-
      -f /mnt/locust/locustfile.py
      --host http://gateway:8080
      --web-host 0.0.0.0
    depends_on:
      - gateway
    networks:
      - nexus-internal
    labels:
      <<: *common-labels