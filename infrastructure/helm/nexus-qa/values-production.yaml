# ═══════════════════════════════════════════════════════════════
# Nexus QA — Production Environment Overrides
# ═══════════════════════════════════════════════════════════════
# Usage:
#   helm upgrade --install nexus-qa ./infrastructure/helm/nexus-qa \
#     --namespace nexus-production --create-namespace \
#     --values infrastructure/helm/nexus-qa/values-production.yaml \
#     --set global.image.tag=$TAG \
#     --set secrets.jwtSecret=$JWT_SECRET \
#     --set secrets.postgresPassword=$PG_PASS \
#     --set secrets.neo4jPassword=$NEO4J_PASS
# ═══════════════════════════════════════════════════════════════

config:
  nexusEnv: production
  logLevel: WARNING

# ─── Platform Services: HA replicas + autoscaling ─────────────
authService:
  replicas: 3
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 8
    targetCPU: 65

gateway:
  replicas: 3
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 15
    targetCPU: 60

platformApi:
  replicas: 3
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPU: 65

orchestrator:
  replicas: 3
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 12
    targetCPU: 65

# ─── Engines: production-grade ────────────────────────────────
engines:
  shield:
    replicas: 3
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 2Gi

  ears:
    replicas: 2
    gpu: true
    gpuCount: 1
    env:
      WHISPER_DEVICE: cuda
      WHISPER_COMPUTE_TYPE: float16
    persistence:
      audio:
        size: 100Gi

  eyes:
    replicas: 2
    gpu: true
    gpuCount: 1
    env:
      VISION_DEVICE: cuda
    persistence:
      frames:
        size: 100Gi

  heart:
    replicas: 2
    gpu: true
    gpuCount: 1
    resources:
      requests:
        cpu: "4"
        memory: 16Gi
      limits:
        cpu: "8"
        memory: 64Gi
    env:
      LLM_DEVICE: cuda

  backbone:
    replicas: 3
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 4Gi

  nerves:
    replicas: 3

  legs:
    replicas: 3
    resources:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        cpu: "4"
        memory: 8Gi
    persistence:
      evidence:
        size: 50Gi

  hands:
    replicas: 3

  spine:
    replicas: 3
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 4Gi
    persistence:
      documents:
        size: 100Gi

  mouth:
    replicas: 3
    persistence:
      reports:
        size: 50Gi

# ─── Infrastructure: production sizing ────────────────────────
redis:
  maxMemory: 2gb
  persistence:
    size: 20Gi
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 3Gi

postgres:
  persistence:
    size: 100Gi
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      cpu: "4"
      memory: 8Gi

neo4j:
  heapMaxSize: 4G
  pagecacheSize: 2G
  persistence:
    dataSize: 100Gi
    logsSize: 20Gi
  resources:
    requests:
      cpu: "2"
      memory: 4Gi
    limits:
      cpu: "4"
      memory: 8Gi

milvus:
  persistence:
    size: 100Gi
  resources:
    requests:
      cpu: "2"
      memory: 4Gi
    limits:
      cpu: "4"
      memory: 8Gi

ollama:
  gpu:
    enabled: true
    count: all
  persistence:
    size: 200Gi
  resources:
    requests:
      cpu: "2"
      memory: 16Gi
    limits:
      cpu: "8"
      memory: 64Gi

# ─── Frontend: HA ─────────────────────────────────────────────
client:
  replicas: 3

# ─── Monitoring: full retention ───────────────────────────────
monitoring:
  prometheus:
    retentionDays: 90
    persistence:
      size: 200Gi
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: "2"
        memory: 4Gi

  grafana:
    persistence:
      size: 10Gi

  # Production: observability is mandatory
  serviceMonitor:
    enabled: true
    interval: 15s
    scrapeTimeout: 10s
    additionalLabels:
      release: kube-prometheus-stack

  alerts:
    enabled: true
    additionalLabels:
      release: kube-prometheus-stack

modelCache:
  size: 200Gi

# ─── Ingress: enabled with TLS ───────────────────────────────
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
  host: nexus-qa.example.com
  tls:
    enabled: true
    secretName: nexus-qa-tls

# ─── Network Policies: enabled ────────────────────────────────
networkPolicies:
  enabled: true
