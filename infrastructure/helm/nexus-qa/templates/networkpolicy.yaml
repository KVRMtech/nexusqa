{{/*
=================================================================
NetworkPolicies — micro-segmentation for production security
=================================================================
When enabled, enforces:
  1. Default-deny all ingress
  2. Infrastructure (redis, postgres, neo4j, milvus) only reachable from app pods
  3. Engines only reachable from gateway, orchestrator, platform-api
  4. Gateway reachable from client + ingress
  5. Client reachable from ingress only
*/}}

{{- if .Values.networkPolicies.enabled }}

{{- $fullname := include "nexus-qa.fullname" . }}
{{- $root := . }}

{{/* ═══════ Default Deny ═══════ */}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-default-deny
  labels:
    {{- include "nexus-qa.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "nexus-qa.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress: []

{{/* ═══════ Allow Infrastructure from App Pods ═══════ */}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-allow-infra
  labels:
    {{- include "nexus-qa.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - port: {{ .Values.redis.port }}
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-allow-postgres
  labels:
    {{- include "nexus-qa.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - port: {{ .Values.postgres.port }}
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-allow-neo4j
  labels:
    {{- include "nexus-qa.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: neo4j
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - port: {{ .Values.neo4j.ports.bolt }}
          protocol: TCP
        - port: {{ .Values.neo4j.ports.http }}
          protocol: TCP

{{/* ═══════ Allow Engines from Gateway/Orchestrator/Platform ═══════ */}}
{{- $engineComponents := list "shield-engine" "ears-engine" "eyes-engine" "heart-engine" "backbone-engine" "nerves-engine" "legs-engine" "hands-engine" "spine-engine" "mouth-engine" "brain-engine" }}
{{- range $component := $engineComponents }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-allow-{{ $component }}
  labels:
    {{- include "nexus-qa.labels" $root | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ $root.Release.Name }}
      app.kubernetes.io/component: {{ $component }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ $root.Release.Name }}
              app.kubernetes.io/component: gateway
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ $root.Release.Name }}
              app.kubernetes.io/component: orchestrator
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ $root.Release.Name }}
              app.kubernetes.io/component: platform-api
{{- end }}

{{/* ═══════ Allow Gateway from Client + Ingress ═══════ */}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-allow-gateway
  labels:
    {{- include "nexus-qa.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: client
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: orchestrator
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: platform-api
        {{- if .Values.ingress.enabled }}
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
        {{- end }}

{{/* ═══════ Allow Client from Ingress ═══════ */}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-allow-client
  labels:
    {{- include "nexus-qa.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: client
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- if .Values.ingress.enabled }}
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
        {{- end }}
      ports:
        - port: {{ .Values.client.port }}
          protocol: TCP

{{/* ═══════ Allow Auth from all App Pods ═══════ */}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-allow-auth
  labels:
    {{- include "nexus-qa.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: auth
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - port: {{ .Values.authService.port }}
          protocol: TCP

{{/* ═══════ Allow Orchestrator from Gateway/Platform ═══════ */}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-allow-orchestrator
  labels:
    {{- include "nexus-qa.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: orchestrator
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: gateway
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: platform-api
      ports:
        - port: {{ .Values.orchestrator.port }}
          protocol: TCP

{{/* ═══════ Allow Monitoring ═══════ */}}
{{- if .Values.monitoring.prometheus.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-allow-prometheus-scrape
  labels:
    {{- include "nexus-qa.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: prometheus
{{- end }}

{{- end }}
