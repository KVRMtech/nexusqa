{{/*
=================================================================
PersistentVolumeClaims — storage for engines and model cache
=================================================================
*/}}

{{/* ── Model Cache (shared RWX) ── */}}
{{- if .Values.modelCache.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "nexus-qa.fullname" . }}-model-cache
  labels:
    {{- include "nexus-qa.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.modelCache.accessMode | default "ReadWriteMany" }}
  {{- if .Values.global.storageClass }}
  storageClassName: {{ .Values.global.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.modelCache.size }}
{{- end }}
---
{{/* ── Ears Audio Storage ── */}}
{{- if and .Values.engines.ears.enabled (default false (dig "persistence" "audio" "enabled" false .Values.engines.ears)) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "nexus-qa.fullname" . }}-audio-storage
  labels:
    {{- include "nexus-qa.componentLabels" (dict "root" . "component" "ears-engine") | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.global.storageClass }}
  storageClassName: {{ .Values.global.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.engines.ears.persistence.audio.size }}
{{- end }}
