{{/*
=================================================================
External Secrets — Integrates with External Secrets Operator (ESO)

When .Values.externalSecrets.enabled is true, this creates an
ExternalSecret resource that syncs secrets from a remote backend
(AWS Secrets Manager, HashiCorp Vault, Azure Key Vault, GCP Secret
Manager) into the same Kubernetes Secret that services already
reference via envFrom/secretRef.

This replaces the static secret.yaml when using ESO, ensuring
secrets are never stored in values files or Helm releases.

Prerequisites:
  1. Install ESO: helm install eso external-secrets/external-secrets
  2. Create a SecretStore or ClusterSecretStore
  3. Set externalSecrets.enabled=true and configure the backend
=================================================================
*/}}

{{- if .Values.externalSecrets.enabled }}
{{- $fullname := include "nexus-qa.fullname" . }}

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $fullname }}-secrets
  labels:
    {{- include "nexus-qa.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook-weight: "-5"
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" }}

  {{- if .Values.externalSecrets.secretStoreRef.kind | default "" | eq "ClusterSecretStore" }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
    kind: ClusterSecretStore
  {{- else }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
    kind: SecretStore
  {{- end }}

  target:
    name: {{ include "nexus-qa.secretName" . }}
    creationPolicy: Owner
    template:
      type: Opaque

  data:
    # ── Core Platform ──
    - secretKey: jwt-secret
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKeyPrefix | default "nexus-qa" }}/jwt-secret
        {{- if .Values.externalSecrets.property }}
        property: {{ .Values.externalSecrets.property }}
        {{- end }}

    - secretKey: postgres-password
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKeyPrefix | default "nexus-qa" }}/postgres-password
        {{- if .Values.externalSecrets.property }}
        property: {{ .Values.externalSecrets.property }}
        {{- end }}

    - secretKey: redis-password
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKeyPrefix | default "nexus-qa" }}/redis-password
        {{- if .Values.externalSecrets.property }}
        property: {{ .Values.externalSecrets.property }}
        {{- end }}

    - secretKey: neo4j-password
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKeyPrefix | default "nexus-qa" }}/neo4j-password
        {{- if .Values.externalSecrets.property }}
        property: {{ .Values.externalSecrets.property }}
        {{- end }}

    - secretKey: minio-access-key
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKeyPrefix | default "nexus-qa" }}/minio-access-key
        {{- if .Values.externalSecrets.property }}
        property: {{ .Values.externalSecrets.property }}
        {{- end }}

    - secretKey: minio-secret-key
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKeyPrefix | default "nexus-qa" }}/minio-secret-key
        {{- if .Values.externalSecrets.property }}
        property: {{ .Values.externalSecrets.property }}
        {{- end }}

    - secretKey: grafana-password
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKeyPrefix | default "nexus-qa" }}/grafana-password
        {{- if .Values.externalSecrets.property }}
        property: {{ .Values.externalSecrets.property }}
        {{- end }}

    # ── Optional Engine Secrets ──
    {{- if .Values.externalSecrets.includeShieldKey }}
    - secretKey: shield-encryption-key
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKeyPrefix | default "nexus-qa" }}/shield-encryption-key
        {{- if .Values.externalSecrets.property }}
        property: {{ .Values.externalSecrets.property }}
        {{- end }}
    {{- end }}

    {{- if .Values.externalSecrets.includeEarsToken }}
    - secretKey: ears-hf-token
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKeyPrefix | default "nexus-qa" }}/ears-hf-token
        {{- if .Values.externalSecrets.property }}
        property: {{ .Values.externalSecrets.property }}
        {{- end }}
    {{- end }}

{{- end }}
