{{/*
=================================================================
Secret — credentials for all services

When externalSecrets.enabled is true, the ExternalSecret resource
manages this Secret instead. This template is skipped to avoid
conflicts between Helm-managed and ESO-managed secrets.
=================================================================
*/}}
{{- if not .Values.externalSecrets.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nexus-qa.secretName" . }}
  labels:
    {{- include "nexus-qa.labels" . | nindent 4 }}
type: Opaque
data:
  jwt-secret: {{ .Values.secrets.jwtSecret | b64enc | quote }}
  postgres-password: {{ .Values.secrets.postgresPassword | b64enc | quote }}
  redis-password: {{ .Values.secrets.redisPassword | default "" | b64enc | quote }}
  neo4j-password: {{ .Values.secrets.neo4jPassword | b64enc | quote }}
  minio-access-key: {{ .Values.secrets.minioAccessKey | b64enc | quote }}
  minio-secret-key: {{ .Values.secrets.minioSecretKey | b64enc | quote }}
  grafana-password: {{ .Values.secrets.grafanaPassword | b64enc | quote }}
  {{- if .Values.secrets.shieldEncryptionKey }}
  shield-encryption-key: {{ .Values.secrets.shieldEncryptionKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.earsHfToken }}
  ears-hf-token: {{ .Values.secrets.earsHfToken | b64enc | quote }}
  {{- end }}
{{- end }}
