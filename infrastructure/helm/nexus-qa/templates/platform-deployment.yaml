{{/*
=================================================================
Platform Deployments — auth-service, gateway, platform-api
=================================================================
*/}}

{{- $fullname := include "nexus-qa.fullname" . }}
{{- $root := . }}

{{/* ═══════ Auth Service ═══════ */}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-auth
  labels:
    {{- include "nexus-qa.componentLabels" (dict "root" $root "component" "auth") | nindent 4 }}
spec:
  {{- if not .Values.authService.autoscaling.enabled }}
  replicas: {{ .Values.authService.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "nexus-qa.componentSelectorLabels" (dict "root" $root "component" "auth") | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "nexus-qa.componentLabels" (dict "root" $root "component" "auth") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $root | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") $root | sha256sum }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name | default (include "nexus-qa.fullname" .) }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: auth
          image: {{ include "nexus-qa.image" (dict "root" $root "service" "auth-service" "tag" "") }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.authService.port }}
              protocol: TCP
          env:
            {{- include "nexus-qa.commonEnv" (dict "root" $root) | nindent 12 }}
            - name: PORT
              value: {{ .Values.authService.port | quote }}
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "nexus-qa.configName" $root }}
                  key: DATABASE_URL
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "nexus-qa.secretName" $root }}
                  key: postgres-password
          resources:
            {{- toYaml .Values.authService.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 20
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

{{/* ═══════ API Gateway ═══════ */}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-gateway
  labels:
    {{- include "nexus-qa.componentLabels" (dict "root" $root "component" "gateway") | nindent 4 }}
spec:
  {{- if not .Values.gateway.autoscaling.enabled }}
  replicas: {{ .Values.gateway.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "nexus-qa.componentSelectorLabels" (dict "root" $root "component" "gateway") | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "nexus-qa.componentLabels" (dict "root" $root "component" "gateway") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $root | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") $root | sha256sum }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name | default (include "nexus-qa.fullname" .) }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: gateway
          image: {{ include "nexus-qa.image" (dict "root" $root "service" "gateway" "tag" "") }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.gateway.port }}
              protocol: TCP
          env:
            {{- include "nexus-qa.commonEnv" (dict "root" $root) | nindent 12 }}
            - name: PORT
              value: {{ .Values.gateway.port | quote }}
            {{- /* Gateway needs all engine URLs */}}
            - name: SHIELD_ENGINE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "nexus-qa.configName" $root }}
                  key: SHIELD_ENGINE_URL
            - name: EARS_ENGINE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "nexus-qa.configName" $root }}
                  key: EARS_ENGINE_URL
            - name: EYES_ENGINE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "nexus-qa.configName" $root }}
                  key: EYES_ENGINE_URL
            - name: HEART_ENGINE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "nexus-qa.configName" $root }}
                  key: HEART_ENGINE_URL
            - name: BACKBONE_ENGINE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "nexus-qa.configName" $root }}
                  key: BACKBONE_ENGINE_URL
            - name: NERVES_ENGINE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "nexus-qa.configName" $root }}
                  key: NERVES_ENGINE_URL
            - name: LEGS_ENGINE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "nexus-qa.configName" $root }}
                  key: LEGS_ENGINE_URL
            - name: HANDS_ENGINE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "nexus-qa.configName" $root }}
                  key: HANDS_ENGINE_URL
            - name: SPINE_ENGINE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "nexus-qa.configName" $root }}
                  key: SPINE_ENGINE_URL
            - name: MOUTH_ENGINE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "nexus-qa.configName" $root }}
                  key: MOUTH_ENGINE_URL
            - name: ORCHESTRATOR_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "nexus-qa.configName" $root }}
                  key: ORCHESTRATOR_URL
            - name: BRAIN_ENGINE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "nexus-qa.configName" $root }}
                  key: BRAIN_ENGINE_URL
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "nexus-qa.configName" $root }}
                  key: AUTH_SERVICE_URL
            - name: PLATFORM_API_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "nexus-qa.configName" $root }}
                  key: PLATFORM_API_URL
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 20
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

