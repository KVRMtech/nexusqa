# ═══════════════════════════════════════════════════════════════
# Nexus QA — Load Test Configuration
# ═══════════════════════════════════════════════════════════════
# Used by both CI pipeline and manual load tests.
# Override via environment variables or CLI flags.
# ═══════════════════════════════════════════════════════════════

[load-test]
# Target service (Platform API by default)
host = http://gateway:8080

# User simulation
users = 100
spawn_rate = 10
run_time = 5m

# SLA thresholds (used by CI gate)
p95_max_ms = 500
p99_max_ms = 2000
error_rate_max_pct = 1.0
min_throughput_rps = 50

# Report output
html_report = reports/load-test-report.html
csv_prefix = reports/load-test

[smoke-test]
# Quick validation (run before full load test)
host = http://gateway:8080
users = 5
spawn_rate = 5
run_time = 30s

[stress-test]
# Find breaking point
host = http://gateway:8080
users = 500
spawn_rate = 25
run_time = 10m
